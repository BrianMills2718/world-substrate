name: chat-world-builder-export
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: world-builder-download
          path: evidence/renders/world-builder-v0.html
          if-no-files-found: error
          retention-days: 1
