<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Replay</title>
<style>
:root{--bg:#eef1f4;--fg:#16212b;--mute:#586573;--panel:#fff;--line:#c9d2db;--blue:#1f5fa8;--orange:#b4540a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;display:flex;flex-direction:column;padding:10px max(12px,env(safe-area-inset-left,0px)) 10px}
h1{font-size:18px;margin:0 0 8px}
#game{flex:1 1 auto;min-height:320px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#222}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-height:40px}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input[type=range]{flex:1 1 160px;min-width:120px}
#label{color:var(--mute);min-width:9em;font-variant-numeric:tabular-nums}
#people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.card b{display:block}
.card .say{color:var(--blue);margin-top:2px;overflow-wrap:anywhere}
.card .no{color:var(--orange)}
#stage{position:relative;flex:1 1 auto;display:flex;min-height:320px}
#stage #game{flex:1 1 auto}
#rulebox{position:absolute;top:10px;right:10px;max-width:min(360px,80%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:2px solid var(--blue);border-radius:10px;padding:10px 12px;display:none;font-size:14px}
#rulebox h2{font-size:15px;margin:0 0 4px}#rulebox h3{font-size:12px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
#rulebox ul{margin:0;padding-left:18px}#rulebox .x{float:right;min-height:0;padding:2px 8px}
#err{color:var(--orange);display:none;margin:8px 0}
</style></head><body>
<h1 id="title">Scene replay</h1>
<div id="demos" style="display:none;margin:0 0 8px"></div>
<div id="err"></div>
<div id="stage"><div id="game"></div><div id="rulebox" role="dialog" aria-label="Rule"></div></div>
<div class="bar">
<button id="play" class="on">Pause</button><button id="rules" style="display:none">Show rules</button><button id="prev">Previous round</button><button id="next">Next round</button>
<select id="speed" aria-label="Speed"><option value="1">1 step/s</option><option value="3" selected>3 steps/s</option><option value="8">8 steps/s</option></select>
<input id="slider" type="range" min="0" value="0" aria-label="Step"><span id="label"></span>
</div>
<div id="people"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<script src="viewer.js"></script>
</body></html>
