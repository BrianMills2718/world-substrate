name: tmp-source-export

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package runtime source
        run: |
          tar -czf world-substrate-replication-source.tgz \
            src/world_substrate \
            reference_worlds \
            scripts/run_contested_world.py \
            scripts/_display.py \
            prompts
      - uses: actions/upload-artifact@v4
        with:
          name: world-substrate-replication-source
          path: world-substrate-replication-source.tgz
          retention-days: 1
