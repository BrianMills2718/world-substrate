function prettyKey(key){return key.replaceAll('_',' ').replace(/\\b\\w/g,c=>c.toUpperCase())}
function formatValue(value){if(value===null||value===undefined||value==='')return '—';if(Array.isArray(value))return value.join(', ');if(typeof value==='object')return JSON.stringify(value);return String(value)}
function appendInspectorRow(body,key,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=formatValue(value);body.append(dt,dd)}
function representedDeliveries(actorId){const rows=[];for(let n=0;n<=idx;n++){for(const effect of FRAMES[n]?.presentation_effects||[]){if(effect.kind==='information_transmission'&&effect.recipient_id===actorId)rows.push(effect)}}return rows}

document.querySelectorAll('[data-kind][data-id]').forEach(el=>{el.onclick=()=>{showInspector(el.dataset.kind,el.dataset.id);if(parent!==window)parent.postMessage({type:'ws-scene-select',entity_id:PROFILE[el.dataset.kind]?.[el.dataset.id]?.entity||el.dataset.id},'*')};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});document.getElementById('inspectorClose').onclick=closeInspector;document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'Pause':'Play';schedule()};document.getElementById('prev').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx-1)};document.getElementById('next').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx+1)};document.getElementById('restart').onclick=()=>{playing=true;document.getElementById('toggle').textContent='Pause';closeInspector();render(0);schedule()};document.getElementById('scrub').oninput=e=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(parseInt(e.target.value,10)||0)};const q=new URLSearchParams(location.search),start=Math.max(0,Math.min(FRAMES.length-1,parseInt(q.get('frame')||'0',10)||0));render(start);if(DRIVEN){document.querySelector('.controls').hidden=true;document.querySelector('.controls').style.display='none'}if(start>0){playing=false;document.getElementById('toggle').textContent='Play'}schedule();window.addEventListener('resize',()=>render(idx));
