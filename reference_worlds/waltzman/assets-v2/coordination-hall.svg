<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#324248"/><stop offset="1" stop-color="#1e2d33"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26353a"/><stop offset="1" stop-color="#142127"/></linearGradient>
 <radialGradient id="rug"><stop stop-color="#466d6b"/><stop offset=".72" stop-color="#294d4d"/><stop offset="1" stop-color="#203c3e"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
 <pattern id="tiles" width="72" height="72" patternUnits="userSpaceOnUse"><rect width="72" height="72" fill="none" stroke="#ffffff" stroke-opacity=".025"/><circle cx="8" cy="8" r="1.3" fill="#fff" opacity=".06"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#floor)"/><rect width="1600" height="900" fill="url(#tiles)"/>
<path d="M0 0h1600v78H0zM0 0h70v900H0zM1530 0h70v900h-70z" fill="url(#wall)"/>
<path d="M72 84h1456" stroke="#78969a" stroke-opacity=".22" stroke-width="3"/>
<!-- work bay -->
<rect x="120" y="110" width="1360" height="195" rx="30" fill="#203036" stroke="#8fb4b5" stroke-opacity=".12"/>
<path d="M180 270h1240" stroke="#9cc5c3" stroke-opacity=".11" stroke-width="2"/>
<!-- six desks -->
<g fill="#493d34" stroke="#a99379" stroke-opacity=".34" filter="url(#shadow)">
 <rect x="170" y="170" width="140" height="64" rx="12"/><rect x="390" y="145" width="140" height="64" rx="12"/><rect x="610" y="132" width="140" height="64" rx="12"/>
 <rect x="850" y="132" width="140" height="64" rx="12"/><rect x="1070" y="145" width="140" height="64" rx="12"/><rect x="1290" y="170" width="140" height="64" rx="12"/>
</g>
<g fill="#81b9b0" opacity=".5"><rect x="205" y="157" width="70" height="9" rx="4"/><rect x="425" y="132" width="70" height="9" rx="4"/><rect x="645" y="119" width="70" height="9" rx="4"/><rect x="885" y="119" width="70" height="9" rx="4"/><rect x="1105" y="132" width="70" height="9" rx="4"/><rect x="1325" y="157" width="70" height="9" rx="4"/></g>
<!-- central chamber -->
<ellipse cx="800" cy="500" rx="285" ry="205" fill="url(#rug)" opacity=".9"/>
<ellipse cx="800" cy="500" rx="170" ry="103" fill="#1b282d" stroke="#8cc6be" stroke-opacity=".3" stroke-width="5" filter="url(#shadow)"/>
<ellipse cx="800" cy="500" rx="133" ry="73" fill="#5a4a3d" stroke="#b79c7d" stroke-opacity=".45" stroke-width="5"/>
<ellipse cx="800" cy="500" rx="82" ry="34" fill="#243d40" stroke="#75c6c1" stroke-opacity=".4" stroke-width="3"/>
<!-- chairs -->
<g fill="#273940" stroke="#92aca9" stroke-opacity=".25"><rect x="765" y="340" width="70" height="42" rx="14"/><rect x="968" y="405" width="54" height="60" rx="14"/><rect x="968" y="540" width="54" height="60" rx="14"/><rect x="765" y="620" width="70" height="42" rx="14"/><rect x="578" y="540" width="54" height="60" rx="14"/><rect x="578" y="405" width="54" height="60" rx="14"/></g>
<!-- side alcoves -->
<g fill="#17262c" stroke="#7ea6a4" stroke-opacity=".18" stroke-width="3">
 <rect x="95" y="355" width="285" height="210" rx="28"/><rect x="1220" y="355" width="285" height="210" rx="28"/>
 <rect x="115" y="650" width="330" height="160" rx="28"/><rect x="1155" y="650" width="330" height="160" rx="28"/>
</g>
<!-- package lane -->
<path d="M800 765V654" stroke="#a7d9d1" stroke-opacity=".18" stroke-width="38" stroke-linecap="round"/><circle cx="800" cy="770" r="58" fill="#26383d" stroke="#73c4bb" stroke-opacity=".25" stroke-width="4"/>
<!-- ambient lamps -->
<g fill="#e9c88c" opacity=".75"><circle cx="106" cy="106" r="8"/><circle cx="1494" cy="106" r="8"/><circle cx="106" cy="840" r="8"/><circle cx="1494" cy="840" r="8"/></g>
</svg>