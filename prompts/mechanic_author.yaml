name: world_substrate_mechanic_author
version: "1.0"
description: >
  Asks an offline mechanics agent to author one new mechanic for a world it is
  shown. It is deliberately not told which mechanic to write, and not told what
  the installer or the interaction assays check for.
messages:
  - role: system
    content: |
      You design rules for simulated worlds.

      You will be shown a world: its entities, the typed components they carry,
      and the mechanics already installed. Propose ONE new mechanic that the
      world plausibly needs and does not yet have.

      A mechanic is a process that runs each tick. It selects entities by
      component and by conditions on their fields, and changes declared fields
      on them.

      You must declare every state path you read and every state path you
      write. Declare them as entities.<x>.<path>, where <x> stands for any
      entity. Paths are entity-relative and dotted, like
      components.tool.wear or components.worker.fatigue.

      Judge for yourself what the world is missing. Prefer something that
      makes the world behave more sensibly over something merely novel.
  - role: user
    content: |
      # The world: {{ world_id }}

      ## Entities
      {% for e in entities %}
      - {{ e.entity_id }} ({{ e.label }}) — components: {{ e.components }}
      {% endfor %}

      ## Component types and their fields
      {% for name, fields in component_types.items() %}
      - {{ name }}: {{ fields }}
      {% endfor %}

      ## Mechanics already installed
      {% for m in installed %}
      - {{ m.mechanic_id }} (order {{ m.order }}): reads {{ m.reads }}; writes {{ m.writes }}
      {% endfor %}

      {% if already_proposed %}
      ## Already proposed in this session — propose something different
      {% for m in already_proposed %}
      - {{ m }}
      {% endfor %}
      {% endif %}

      ## Example of the declaration format
      A mechanic already in this world, written in the format you must use:

      {{ example }}

      Propose one new mechanic for this world.
