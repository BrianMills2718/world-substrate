schema_version: ui-registry/v1
project_id: world-substrate
ui_status: active
# Read this before adding or changing a world-substrate UI; the ecosystem UI index
# (control.brianmills.dev/uis/) is built from these entries.
surfaces:
  - id: world-builder
    name: World Builder
    lifecycle: canonical
    source_path: scripts/world_builder_home.html
    url: https://brianmills.dev/world-builder/
    tests: scripts/e2e/world_builder_e2e.mjs (includes the tooltip check the workspace tooltip policy cites); evidence/ui/saved-player-20261113/browser_check.py
    purpose: Create worlds from language, reopen a private owner library, play and replay spatial worlds, and branch completed saved rounds with exact continuation state.
  - id: waltzman-stakeholder-demo
    name: Waltzman stakeholder demo
    lifecycle: canonical
    source_path: reference_worlds/waltzman/
    url: https://brianmills.dev/waltzman/
    note: The page is deployed from outside this repository; the world, its baseline and its intervention branch live here.
    purpose: The promoted outreach experience, combining natural-language authoring, a fresh trajectory and living inspection of one bounded coordination world.
  - id: living-world-visualization
    name: Standalone living-world visualization
    lifecycle: superseded
    source_path: evidence/renders/waltzman-demo-v0.html
    url: https://brianmills.dev/world-substrate-visualization/
    note: Earlier native event replay, retained as historical visual evidence.
    purpose: Historical native world replay.
  - id: native-composed-coordination-hall
    name: Native composed Coordination Hall
    lifecycle: canonical
    source_path: scripts/build_waltzman_living_replay_v2.py
    url: https://brianmills.dev/waltzman/world-substrate
    purpose: Spatial native reference replay with actors, places and event-linked material state.
    note: Native substrate recording; distinct from the donor runtime at /waltzman/.
  - id: native-run-replays
    name: Native run replays and Waltzman version index
    lifecycle: canonical
    source_path: deploy/cloudflare/native-runs/
    url: https://brianmills.dev/world-substrate-runs/
    tests: deploy/cloudflare/native-runs/build.sh (asserts both pages are non-empty)
    purpose: Index of every Waltzman demo version, plus the static replay of the 2026-10-08 native World Substrate Waltzman run (spikes/any-scenario-2026-10/evidence/waltzman-spec/run2).
