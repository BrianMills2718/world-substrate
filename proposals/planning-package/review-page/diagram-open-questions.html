by rule, judge not asked' shows on a second trader (the cold review's item 8 saw the same split).."}, {"id": "Q95", "label": "Q95: The engine's own replay of a run that installed a rule mid-round", "kind": "AgentQuestion", "explain": "Blocks: Nothing that exists; any future audit or export that replays a judged run through Engine.replay.."}, {"id": "Q96", "label": "Q96: An installed coin rule lets a person take another's coins with no offer from them", "kind": "AgentQuestion", "explain": "Blocks: Trust in installed rulings that move another person's goods or coins (A4, A5); not the install, hold, approve and reject mechanism itself.."}, {"id": "affordance", "label": "Affordance (offered move)", "kind": "Concept", "explain": "A move the rules say a person can try now, with its open fields; the page a decider picks from or an attempt is read against."}, {"id": "agenda", "label": "Agenda count", "kind": "Concept", "explain": "group_decision.agenda_items: a bare number of matters put before the decision; an item has no content. Declared in the group-decision component and changed by the compiled put-matter-on-agenda and settle-agenda-matter rules."}, {"id": "attempt", "label": "Attempt (in own words)", "kind": "Concept", "explain": "What a resident says it physically tries, in its own words, with no outcome field: the world, not the speaker, decides what happens."}, {"id": "attempt-reading", "label": "Attempt reading", "kind": "Concept", "explain": "The interpreter's typed reading of an attempt: one move kind and its field rows (field, value, quoted_span: the words in the attempt behind that value), or the kind 'wait'; read as unmatched if it names an unknown kind or entity, misses a field, or quotes words not said."}, {"id": "build", "label": "Build", "kind": "Concept", "explain": "Description to spec, actions, rules, assembly, scripted test run and score."}, {"id": "builder", "label": "World Builder and its bundle", "kind": "Concept", "explain": "The public page and service where a person describes a world, approves its rules and watches it run; a build's output is an authoring bundle."}, {"id": "causal-parent", "label": "Hard causal parent", "kind": "Concept", "explain": "An earlier event a rule declares as mechanically supporting this one; kept apart from the information a person merely had in mind."}, {"id": "causal-trace", "label": "Causal trace", "kind": "Concept", "explain": "The retained chain of events of a run, each naming the move or process, its checks and its changes; the evidence for any claim about a run."}, {"id": "check", "label": "Check", "kind": "Concept", "explain": "One condition on a move or process (actual versus required); a move commits only when every check holds, else the event records which failed."}, {"id": "compiler", "label": "Compiler", "kind": "Concept", "explain": "Turns proposed rules into installed rules and derives what each may read and write."}, {"id": "engine", "label": "Engine", "kind": "Concept", "explain": "Applies each attempt atomically or refuses it with a recorded reason; runs due processes each tick."}, {"id": "entity-component", "label": "Entity and component", "kind": "Concept", "explain": "An entity is one thing in the world (person, wall, glass, decision) with an id, a label, categories and typed components; a component is a named record of typed fields (boundary.passable, group_decision.status) that checks read and effects write."}, {"id": "estimate-rule", "label": "Estimate rule", "kind": "Concept", "dashed": true, "explain": "Plan estimate-rules E1 (planned, not implemented): a process or move whose outcome depends on a chance (later a pick or an amount) that Jev estimates from fields the rule declares; it declares a fixed question, its reads, the answer type, the model, a required fallback (refuse or a declared value) and the effects for each result."}, {"id": "estimator", "label": "Estimator", "kind": "Concept", "dashed": true, "explain": "Plan estimate-rules E1 (planned, not implemented): what the engine asks for an estimate; live it is llm_client.call_decisions on Jev (one retry, then the rule's fallback), in a replay it reads the recorded estimates and stops with 'no recorded estimate' rather than call Jev; one call per distinct question and inputs per run."}, {"id": "event", "label": "Event", "kind": "Concept", "explain": "The record of one attempt or process step: status, checks, changes, an id like r14-e00012."}, {"id": "gen-rules", "label": "Generated actions and rules", "kind": "Concept", "explain": "The moves and processes the fixed parts do not cover, written by the rules-writing AI and compiled."}, {"id": "group-decision", "label": "Group decision", "kind": "Concept", "explain": "A decision with support, deadline, deployment and review; changed only by fixed rules."}, {"id": "harness-build", "label": "Build in an agent harness", "kind": "Concept", "dashed": true, "explain": "Decision 008: worlds built by an agent that drafts, checks and edits; scripts/world_harness.py exists but the live service does not call it."}, {"id": "judge-ruling", "label": "Judge ruling", "kind": "Concept", "explain": "Plan ai-judge J2 (built 2026-11-10): Concordia's game master (EventResolution), given the whole world and pass 1 of the consequence report, proposes a rule for the constraint an unmatched attempt raises (can coins change hands here?); after reading the pass 2 test run of that rule it confirms, revises once or withdraws. Never an outcome or another person's choice."}, {"id": "law-check", "label": "Law check", "kind": "Concept", "explain": "Plan declared-laws S2 (built): inside the same commit as the write-scope check, every move, round process and knock-on effect is checked against the world's declared laws; a breach refuses the whole step or moment as law_breach and names the law, and nothing changes. A test-run breach is a build finding sent to the rules writer and the world designer."}, {"id": "law-fingerprint", "label": "Executable-law fingerprint", "kind": "Concept", "dashed": true, "explain": "Roadmap hardening item: fingerprint the exact executable law and compiler version."}, {"id": "mechanic", "label": "Installed mechanic", "kind": "Concept", "explain": "One installed action rule: an action kind's selector, checks, effects and derived reads and writes, compiled and frozen in the profile; the root rule says installed mechanics alone decide what happens."}, {"id": "mechanisms", "label": "Mechanisms library", "kind": "Concept", "explain": "Reusable hand-written rule families (liquid, ownership, thermal, damage, time) that reference worlds such as Castaway register (reference_worlds/castaway/overheat.py:14); generated worlds get only their compiled mechanics and processes (scripts/run_authored_world.py:71, Q28)."}, {"id": "observation", "label": "Observation", "kind": "Concept", "explain": "What one actor sees this round: the fields its senses and position allow, never the whole world."}, {"id": "offer", "label": "Voluntary exchange offer", "kind": "Concept", "dashed": true, "explain": "Q96 design contract (planned, not implemented): a server-sealed run-continuation record binding a proposer, respondent, exact terms, rule fingerprint and lifecycle state. The respondent owns acceptance or refusal; acceptance authorizes only those terms and settlement still requires a feasible atomic Engine transition. A message or reusable ruling is not consent."}, {"id": "people-world", "label": "People world", "kind": "Concept", "explain": "A world built from a description about people: people, information, moments and the fixed people rules."}, {"id": "person", "label": "Person and brief", "kind": "Concept", "explain": "A person the spec names, with goals and beliefs, and the brief only their own resident reads."}, {"id": "place-way", "label": "Place and way", "kind": "Concept", "explain": "Where things are, and what lies between two places (a door, a brick wall) with whether it is passable; written per world as entities from the bundle contract, and the move rule checks the way."}, {"id": "profile", "label": "Frozen mechanic profile", "kind": "Concept", "explain": "The validated, installed rules of a world, frozen under one id before any run; changing a rule means a new profile."}, {"id": "readout", "label": "Readout", "kind": "Concept", "explain": "One AI summary of a run whose every cited event id is checked against the run."}, {"id": "resident", "label": "Resident", "kind": "Concept", "explain": "One Concordia AI agent per person: sees its brief, memory and what it can see, and answers belief, attempt (in its own words), expected effect and work; the older menu reply picks an offered move."}, {"id": "rules-retry", "label": "Rules retry", "kind": "Concept", "explain": "A second rules attempt after a rejection or weak score; skipped after 80 s."}, {"id": "rules-review", "label": "Independent rules review", "kind": "Concept", "explain": "Plan declared-laws S3 (built): a separate model call with a fresh context reads the description, the declared laws and the written rules, and lists concrete mismatches (each naming a rule and the words it contradicts) for the rules writer to fix; findings, never a pass mark. Runs on things worlds and, from 2026-10-30, on people worlds."}, {"id": "ruling-rule", "label": "Ruling-origin rule", "kind": "Concept", "explain": "Plan ai-judge J3 (built 2026-11-10): a rule in the existing declaration language made from a confirmed judge ruling after it passes the World Builder rules check and test run, listed under its ruling, whose entry records where it came from (round, person, attempt, event id) and its state (installed, held, rejected, withdrawn when installing failed, or language gap); it applies to everyone in the same situation and the attempt settles through it. It is run state, sealed with the snapshot, beside the world's own rules (Rulebook). A ruling the language cannot express is refused and recorded as a language gap. Known defect (Q96): a coin rule written for one person's offer can move coins without the other person's choice."}, {"id": "run-log", "label": "Run log", "kind": "Concept", "explain": "One line per request with its trace ids, cost and full artifacts; the source for shares and trace reads."}, {"id": "run-loop", "label": "Run loop", "kind": "Concept", "explain": "Each round: everyone decides, picks are submitted in a rotating order, then processes run."}, {"id": "scene-replay", "label": "Scene replay", "kind": "Concept", "explain": "The page's round-by-round picture of a run: who did what and said what, rebuilt from the run rows; it already quotes a retry's own words."}, {"id": "sense", "label": "Linguistic Core sense and roles", "kind": "Concept", "explain": "The meaning and participant roles of a move kind, supplied by Linguistic Core; never its effects, quantities or timing."}, {"id": "share", "label": "Share link and replay", "kind": "Concept", "explain": "A saved run rebuilt from the run log that a visitor replays with no AI calls."}, {"id": "skill-roll", "label": "Skill roll", "kind": "Concept", "dashed": true, "explain": "Plan S3: a move's outcome depends on a seeded, recorded roll against the person's skill, so someone untrained who flies a helicopter can crash it."}, {"id": "stopping-point", "label": "Plain-words stopping point", "kind": "Concept", "dashed": true, "explain": "Plan ai-judge J5 (planned, not implemented): a stopping point the person writes in plain words ('stop once the team has agreed a budget'), assessed by the judge after every completed round; skipping requires proof that the complete dependency set is unchanged, unavailable for unrestricted natural-language conditions, as one more condition of the run stop setting."}, {"id": "support", "label": "Support", "kind": "Concept", "explain": "A member's stance on the decision: none, full or conditional on a concern."}, {"id": "task", "label": "Task", "kind": "Concept", "explain": "A watched field value that takes several rounds, started by a person or the world, ended by a process: finished or failed part-way."}, {"id": "test-run", "label": "Scripted test run", "kind": "Concept", "explain": "The build's free run with simple moves that scores the rules and lists long tasks and whether each can fail part-way."}, {"id": "unmatched-attempt", "label": "Unmatched attempt", "kind": "Concept", "explain": "An attempt no move kind covers: it changes nothing, the person learns nothing came of it, and the run lists it for the rules writer."}, {"id": "world-design", "label": "World design (bundle)", "kind": "Concept", "explain": "The build's first AI step: it reads the description and writes the world's people, places, things and starting state as an authoring bundle; plan declared-laws S1 adds the world's resources and laws to its output, and the rules writer receives them as input."}, {"id": "world-law", "label": "Declared world law", "kind": "Concept", "explain": "Plan declared-laws S1 (built): a law the AI writes when it designs a world, in that world's own terms: a resource whose total only named moves may change (pencils are made only by the factory's make move), or a move meaning such as 'a purchase moves goods one way and payment the other'. Never a fixed list of move types. The bundle validator checks each law's shape; the rules writer is given the laws and told to keep them; the engine keeps them at every commit (S2, built)."}, {"id": "write-scope", "label": "Declared write scope", "kind": "Concept", "explain": "The fields a rule says it may change; the Engine refuses any change outside them. Read scopes are recorded, not enforced."}], "edges": [{"id": "Q1-rules-retry", "source": "Q1", "target": "rules-retry", "label": "bears on"}, {"id": "Q1-test-run", "source": "Q1", "target": "test-run", "label": "bears on"}, {"id": "Q1-build", "source": "Q1", "target": "build", "label": "bears on"}, {"id": "Q3-agenda", "source": "Q3", "target": "agenda", "label": "bears on"}, {"id" <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = async () => {
    await mermaid.run({querySelector: '.mermaid:not([data-processed])'});
    document.querySelectorAll('.mermaid svg').forEach(svg => {
      // Mermaid's responsive width shrinks labels with the whole drawing. Keep its
      // native coordinate size instead, and let the existing container scroll.
      const box = svg.viewBox.baseVal;
      if (!box.width || !box.height) return;
      svg.style.width = box.width + 'px';
      svg.style.height = box.height + 'px';
      const el = svg.parentElement;
      el.tabIndex = 0;
      el.setAttribute('role', 'region');
      el.setAttribute('aria-label', 'Diagram. Scroll sideways to read the whole drawing.');
      if (!el.dataset.scrollHelp) {
        const note = document.createElement('p'); note.className = 'note';
        note.textContent = 'Scroll sideways to read wide diagrams. With a keyboard, focus the drawing and use the arrow keys.';
        el.before(note);
        el.dataset.scrollHelp = 'true';
      }
    });
  };
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
