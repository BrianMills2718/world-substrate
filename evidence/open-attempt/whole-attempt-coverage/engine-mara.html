</style></head><body><div class='shell'><div class='top'><div><h1>Scene replay</h1><p class='sub'></p></div><div class='badge'>AI-chosen moves (llm-resident (Concordia) recorded-native-interpretation) · free</div></div>
<div class='stage'><div class='actor' data-actor='ari'><div class='avatar' style='--accent:#777'>👤</div><div class='name'>Ari</div></div><div class='thought' data-thought='ari'></div><div class='actor' data-actor='bo'><div class='avatar' style='--accent:#777'>👤</div><div class='name'>Bo</div></div><div class='thought' data-thought='bo'></div><div class='actor' data-actor='mara'><div class='avatar' style='--accent:#777'>👤</div><div class='name'>Mara</div></div><div class='thought' data-thought='mara'></div><div class='hud'><div class='turn' id='turn'></div><div id='moments'></div></div><div class='action' id='action'></div><div class='entity' data-entity='position-mara'>●<small>Recorded position of mara</small></div></div>

<script>const FRAMES=[{"turn":2,"actors":{"ari":{"status":"no_action","action":"wait","reasoning":"Recorded-input replay.","retried":false,"did":null},"bo":{"status":"no_action","action":"wait","reasoning":"Recorded-input replay.","retried":false,"did":null},"mara":{"status":"accepted","action":"state-concerned position-mara","reasoning":"Recorded-input replay.","retried":false,"did":{"actor":"mara","base_revision":2,"controller":"live:resident","kind":"state-concerned","position":"position-mara"}}},"actor_positions":{"ari":[20.0,78.0],"bo":[50.0,78.0],"mara":[80.0,78.0]},"holdings":{"ari":[],"bo":[],"mara":[]},"holders":{},"progress":{},"items":{"position-mara":{"state":"default","placed_at":null}},"active_stations":[],"moments":[]}];const PROFILE={"schema_version":"world-substrate-scene-profile/v0","world":"prototype-pump-validation","world_model":"prototype-pump-validation-v0.json","assets":{"delivery":{"kind":"text","value":"\u2192"},"information":{"kind":"emoji","value":"\u2709\ufe0f"},"live_default":{"kind":"text","value":"\u25cf"},"participant":{"kind":"emoji","value":"\ud83d\udc64"}},"actors":{"ari":{"asset":"participant","home":[20.0,78.0],"carry_offset":[5,3],"carry_spacing":[0,5]},"bo":{"asset":"participant","home":[50.0,78.0],"carry_offset":[5,3],"carry_spacing":[0,5]},"mara":{"asset":"participant","home":[80.0,78.0],"carry_offset":[5,3],"carry_spacing":[0,5]}},"stations":{},"entities":{"position-mara":{"asset":"live_default","label":"Recorded position of mara","home":[50.0,58.0]}},"action_visuals":{"state-concerned":{"item_field":"position","label_template":"state-concerned {position}"}},"progress_assets":{},"bootstrap":{"schema_version":"world-substrate-scene-profile-bootstrap/v0","inferred_initial_owners":{},"inferred_action_fields":{"state-concerned":{"item_field":"position","station_field":null}},"declared_action_bindings":[],"binding_resolution_errors":{},"reviewed_actions":[],"auto_layout":{"enabled":true,"algorithm":"role-grid-v0","proposed_geometry":["actors.ari.home","actors.bo.home","actors.mara.home","entities.position-mara.home"]},"todos":[{"kind":"action_projection","target":"action_visuals.state-concerned","reason":"motion/state projection needs an explicit review or catalog binding"}]},"resolved_assets":{"delivery":"\u2192","information":"\u2709\ufe0f","live_default":"\u25cf","participant":"\ud83d\udc64"}};const ASSETS=PROFILE.resolved_assets;let idx=0,timer=null,playing=true;
function setXY(el,p){el.style.left=p[0]+'%';el.style.top=p[1]+'%'}
function stationPoint(id){const s=PROFILE.stations[id];if(!s)return null;if(s.item_anchor)return s.item_anchor;const r=s.rect;return[r[0]+r[2]/2,r[1]+r[3]/2]}
function itemPos(id,f){const state=f.items[id]||{},preferStation=(PROFILE.station_precedence_states||[]).includes(state.state);if(preferStation&&state.placed_at){const p=stationPoint(state.placed_at);if(p)return p}for(const a of Object.keys(PROFILE.actors)){const held=f.holdings[a]||[];const n=held.indexOf(id);if(n>=0){const base=f.actor_positions[a],av=PROFILE.actors[a],j=held.indexOf(id);return[base[0]+av.carry_offset[0]+av.carry_spacing[0]*j,base[1]+av.carry_offset[1]+av.carry_spacing[1]*j]}}if(state.placed_at){const p=stationPoint(state.placed_at);if(p)return p}return PROFILE.entities[id].home}
function styleEntity(el,state){const s=PROFILE.state_styles?.[state]||{};el.style.transform='scale('+(s.scale??1)+') rotate('+(s.rotate_deg??0)+'deg)';el.style.filter='drop-shadow(0 4px 2px #0004) brightness('+(s.brightness??1)+') saturate('+(s.saturation??1)+')'}
function progressIcon(kind){const key=PROFILE.progress_assets?.[kind];return key?ASSETS[key]:(kind||'')}
function render(i){idx=Math.max(0,Math.min(FRAMES.length-1,i));const f=FRAMES[idx];document.getElementById('turn').textContent='Round '+f.turn+(FRAMES.length>1?' ('+(idx+1)+' of '+FRAMES.length+')':'');document.getElementById('progressbar').style.width=((idx+1)/FRAMES.length*100)+'%';
 for(const a of Object.keys(PROFILE.actors)){const el=document.querySelector('[data-actor="'+a+'"]');setXY(el,f.actor_positions[a]);const th=document.querySelector('[data-thought="'+a+'"]');const rec=f.actors[a]||{};th.innerHTML='<strong>'+a+' · '+(rec.action||'wait')+'</strong>'+(rec.reasoning||'');const n=Object.keys(PROFILE.actors).indexOf(a);th.style.left=(n%2===0?'2%':'auto');th.style.right=(n%2===0?'auto':'2%');th.style.top=(18+Math.floor(n/2)*18)+'%'}
 for(const id of Object.keys(PROFILE.entities)){const el=document.querySelector('[data-entity="'+id+'"]');setXY(el,itemPos(id,f));styleEntity(el,(f.items[id]||{}).state)}
 document.querySelectorAll('[data-station]').forEach(el=>el.classList.toggle('active',f.active_stations.includes(el.dataset.station)));
 document.querySelectorAll('[data-progress-actor]').forEach(el=>{const a=el.dataset.progressActor,p=f.progress[a]||{};el.querySelector('.progress-items').innerHTML=(p.plated||[]).map(progressIcon).join('');el.querySelector('.progress-needs').textContent=p.filled?'✓ complete':'still needs: '+((p.still_wants||[]).join(', ')||'nothing')});
 const labels=Object.fromEntries((PROFILE.moment_rules||[]).map(r=>[r.id,r.label||r.id]));const terminalIds=new Set((PROFILE.moment_rules||[]).filter(r=>r.terminal).map(r=>r.id));document.getElementById('moments').innerHTML=f.moments.map(m=>'<span class="moment '+(terminalIds.has(m)?'terminal':'')+'">'+(labels[m]||m)+'</span>').join('');document.getElementById('action').textContent=Object.keys(PROFILE.actors).map(a=>a+': '+(f.actors[a]?.action||'wait')).join(' · ')}
function schedule(){clearInterval(timer);if(playing)timer=setInterval(()=>{if(idx>=FRAMES.length-1){playing=false;document.getElementById('toggle').textContent='Play';clearInterval(timer)}else render(idx+1)},2000)}
document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'Pause':'Play';schedule()};document.getElementById('prev').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx-1)};document.getElementById('next').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx+1)};document.getElementById('restart').onclick=()=>{playing=true;document.getElementById('toggle').textContent='Pause';render(0);schedule()};const q=new URLSearchParams(location.search);const start=Math.max(0,Math.min(FRAMES.length-1,(parseInt(q.get('turn')||'1',10)||1)-1));render(start);if(start>0){playing=false;document.getElementById('toggle').textContent='Play'}schedule();
</script><style>.thought.hidden-card{display:none}.thought.one-card{left:2%!important;right:auto!important;top:20%!important;
max-height:60%;overflow:auto}.crowded .action{display:none}.crowded .actor{cursor:pointer}.driven .controls{display:none}

line-height:1.15;max-height:3.5em;overflow:hidden}
.piled .entity{display:none!important}.crowded .stage{aspect-ratio:4/3}.piled .thought.one-card{width:96%;top:9%!important;max-height:38%}.driven .top{display:none}
.crowded .name{max-height:none}.did{display:block;font-size:10px;line-height:1.15;margin-top:2px;color:#1b2226}
.st-acted .avatar{outline:4px solid #2f7fd6}.st-refused .avatar{outline:4px dashed #d9722b}.st-refused .did{color:#8a4310;font-weight:700}.st-waited .avatar{outline:3px solid #9aa0a4;opacity:.65}.st-waited .did{color:#555}

#ws-story .row{border-left:3px solid #4d5a62;padding:3px 8px;margin:3px 0}#ws-story .row.new{border-left-color:#5aa2ee;background:#ffffff0d}#ws-story b{font-weight:600}#ws-story .now{color:#fff;font-weight:700}#ws-story .by{color:#aeb8bd;font-size:12px}

<script>(function(){
const STORY={"rounds": {"2": {"people": {"ari": {"state": "waited", "more": [], "did": "waited"}, "bo": {"state": "waited", "more": [], "did": "waited"}, "mara": {"state": "acted", "more": ["Changed: Recorded position of mara \u2192 stance: concerned."], "did": "state concerned"}}, "changed": [{"label": "Recorded position of mara", "now": "stance: concerned", "was": "stance: unexpressed", "by": "Mara", "tick": false}], "same": []}}};const ids=Object.keys(PROFILE.actors),crowded=ids.length>4,base=render;let pick=null;
const nameOf=a=>document.querySelector('[data-actor="'+a+'"] .name').textContent;
render=function(i){base(i);const f=FRAMES[idx];tell(f);said();if(!crowded)return;
 const shown=pick||ids.find(a=>f.actors[a]&&f.actors[a].action)||ids[0];
 ids.forEach(a=>{const th=document.querySelector('[data-thought="'+a+'"]');th.classList.toggle('hidden-card',a!==shown);th.classList.toggle('one-card',a===shown);
  const t=th.querySelector('strong'),said=((STORY.rounds[f.turn]||{}).people||{})[a];if(t)t.textContent=nameOf(a)+' · '+(said?said.did:((f.actors[a]||{}).action||'wait').replace(/-/g,' '))});
 ids.forEach(a=>{document.querySelector('[data-actor="'+a+'"]').classList.toggle('picked',a===shown);const th=document.querySelector('[data-thought="'+a+'"]');
  const more=((STORY.rounds[f.turn]||{}).people||{})[a];if(more&&more.more.length){const d=document.createElement('div');d.className='card-more';d.textContent=more.more.join(' ');th.append(d)}});
 spreadPeople(f);spreadThings(f);said()};
// What each person did and what the world now looks like: this is what changes from round to round.
function tell(f){const r=STORY.rounds[f.turn];if(!r)return;
 ids.forEach(a=>{const el=document.querySelector('[data-actor="'+a+'"]'),p=r.people[a]||{state:'waited',did:'waited'};
  el.classList.remove('st-acted','st-refused','st-waited');el.classList.add('st-'+p.state);
  let d=el.querySelector('.did');if(!d){d=document.createElement('span');d.className='did';el.append(d)}d.textContent=p.did});
 let box=document.getElementById('ws-story');if(!box){box=document.createElement('div');box.id='ws-story';document.querySelector('.stage').after(box)}
 box.replaceChildren();const add=(tag,cls,text,to)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;(to||box).append(e);return e};
 add('div','key','Ring around a person: solid blue = acted, dashed orange = refused, faint grey = waited.');
 add('h3','','Changed this round ('+r.changed.length+')');
 if(!r.changed.length)add('div','row','Nothing changed.');
 r.changed.forEach(c=>{const w=add('div','row new','');add('b','',c.label+': ',w);add('span','now',c.now,w);if(c.was)add('span','',' (was '+c.was+')',w);if(c.by)add('div','by',c.by,w)});
 if(r.same.length){const o=box.querySelector('details');const det=add('details','','');add('summary','','Not changed this round ('+r.same.length+')',det);det.addEventListener('toggle',said);
  r.same.forEach(c=>{const w=add('div','row','',det);add('b','',c.label,w);if(c.now){add('span','',': ',w);add('span','now',c.now,w)}})}}
// People standing too close to read share rows; people in other places stay where they are.
function spreadPeople(f){const row=ids.map(a=>[a,f.actor_positions[a]]).sort((x,y)=>x[1][0]-y[1][0]);let group=[];
 const flush=()=>{if(group.length>1){const cx=group.reduce((n,g)=>n+g[1][0],0)/group.length,cols=Math.min(5,group.length),rows=Math.ceil(group.length/cols),
   left=Math.max(1,Math.min(99-cols*19,cx+4-cols*9.5));group.forEach((g,n)=>{const el=document.querySelector('[data-actor="'+g[0]+'"]');
   el.style.left=(left+(n%cols)*19)+'%';el.style.top=(100-(rows-Math.floor(n/cols))*25.5)+'%'})}group=[]};
 row.forEach(g=>{if(group.length&&(g[1][0]-group[group.length-1][1][0]>12||Math.abs(g[1][1]-group[0][1][1])>8))flush();group.push(g)});flush()}
// Things piled in one spot become a grid beside the card; their state styling is kept.
function spreadThings(f){const es=Object.keys(PROFILE.entities).map(id=>document.querySelector('[data-entity="'+id+'"]')),pos=es.map(e=>[parseFloat(e.style.left),parseFloat(e.style.top)]);
 let near=0;pos.forEach((p,i)=>pos.forEach((q,j)=>{if(i<j&&Math.abs(p[0]-q[0])<9&&Math.abs(p[1]-q[1])<9)near++}));
 if(near<es.length)return;document.body.classList.add('piled');const rows=Math.ceil(es.length/4);
 es.forEach((e,n)=>{e.style.left=(37+(n%4)*15.5)+'%';e.style.top=(17+Math.floor(n/4)*Math.min(9,35/rows))+'%';const s=e.querySelector('small');if(s)e.title=s.textContent})}
if(crowded){document.body.classList.add('crowded');const stage=document.querySelector('.stage'),hint=document.createElement('div');hint.className='card-hint';
 hint.textContent='Select a person to read what they thought';stage.append(hint);
 ids.forEach(a=>{const el=document.querySelector('[data-actor="'+a+'"]');el.title='Show what '+nameOf(a)+' thought this round';
  el.addEventListener('click',()=>{pick=a;render(idx)})})}
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.type!=='ws-round')return;playing=false;clearInterval(timer);
 document.body.classList.add('driven');let j=-1;FRAMES.forEach((f,n)=>{if(f.turn===e.data.round)j=n});if(j>=0)render(j)});
function said(){try{window.parent.postMessage({type:'ws-picture-height',height:document.querySelector('.shell').offsetHeight+24},'*')}catch(e){}}
render(idx);said();window.addEventListener('resize',said)})();</script></body></html>
