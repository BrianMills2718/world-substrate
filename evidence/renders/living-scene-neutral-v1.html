</style></head><body><main class='shell'><h1>Living Scene neutral renderer</h1><p class='sub'>Actors, resource, activity, and institution from retained state.</p><section class='stage'><div class='zone' data-zone='lab' style='left:4.0%;top:8.0%;width:92.0%;height:84.0%;'><span>Shared lab</span></div><div id='hud' class='hud'></div><div class='entity-card' data-entity='resource-a'><div class='entity-glyph'>R</div><div><strong>Reserve</strong><div class='entity-values'></div><div class='meter'><i></i></div></div></div><div class='activity-card' data-activity='activity-a'><strong>Coordination task</strong><span class='activity-state'></span></div><div class='institution-card' data-institution='institution-a'><strong>Shared gate</strong><span class='institution-state'></span><small class='institution-counts'></small></div><div class='actor' data-actor='actor-a'><div class='actor-glyph'>A</div><strong>Rhea</strong><small class='actor-state'></small></div><div class='actor' data-actor='actor-b'><div class='actor-glyph'>B</div><strong>Sol</strong><small class='actor-state'></small></div></section><div class='controls'><button id='restart'>↺</button><button id='prev'>←</button><button id='toggle'>Pause</button><button id='next'>→</button><div class='progress'><i id='bar'></i></div></div></main>

mponents.activity.status"},"label":"Coordination task","participants":["actor-a","actor-b"],"render":{"status_binding":"status"},"entity":"activity-a"}},"actors":{"actor-a":{"asset":"a","bindings":{"stance":"components.commitment.stance"},"home":[20.0,58.0],"label":"Rhea","render":{"state_binding":"stance"},"entity":"actor-a"},"actor-b":{"asset":"b","bindings":{"stance":"components.commitment.stance"},"home":[80.0,58.0],"label":"Sol","render":{"state_binding":"stance"},"entity":"actor-b"}},"assets":{"a":{"kind":"text","value":"A"},"b":{"kind":"text","value":"B"},"battery":{"kind":"text","value":"R"}},"entities":{"resource-a":{"asset":"battery","bindings":{"current":"components.resource.current","required":"components.resource.required","unit":"components.resource.unit"},"home":[20.0,28.0],"label":"Reserve","render":{"current_binding":"current","kind":"resource","required_binding":"required","unit_binding":"unit"},"entity":"resource-a"}},"event_visuals":{"neutral.resource.drop":{"label":"reserve falls","operations":[{"actor":"actor-a","animation_ms":350,"entity":"resource-a","op":"actor.move_to","read_paths":{}}]}},"institutions":{"institution-a":{"anchor":[50.0,78.0],"bindings":{"required":"components.institution.required","status":"components.institution.status","support":"components.institution.support"},"label":"Shared gate","render":{"required_binding":"required","status_binding":"status","support_binding":"support"},"entity":"institution-a"}},"presentation":{},"scene":{"aspect_ratio":"16 / 9","autoplay_ms":900,"background":"#dce7e1","shell_background":"#101820"},"scene_id":"neutral-render-v1","schema_version":"world-substrate-living-scene/v1","state_styles":{},"subtitle":"Actors, resource, activity, and institution from retained state.","title":"Living Scene neutral renderer","world":"neutral-render","zones":{"lab":{"anchor":[50.0,50.0],"label":"Shared lab","rect":[4.0,8.0,92.0,84.0]}},"resolved_assets":{"a":"A","b":"B","battery":"R"}};let idx=0,playing=true,ti function xy(el,p){if(!p)return;el.style.left=p[0]+'%';el.style.top=p[1]+'%'}
function bind(view,name){return view?.bindings?.[name]}
function anchorFor(op){if(Array.isArray(op.anchor))return op.anchor;if(op.zone)return PROFILE.zones?.[op.zone]?.anchor||null;if(op.entity)return PROFILE.entities?.[op.entity]?.home||null;return null}
function actorPositions(f){const out={};for(const [id,v] of Object.entries(PROFILE.actors))out[id]=v.home||[50,50];for(const [aid,av] of Object.entries(PROFILE.activities)){const row=f.views.activities?.[aid],status=bind(row,av.render?.status_binding||'status');if(status==='active'&&Array.isArray(av.participants)&&av.anchor){av.participants.forEach((actor,n)=>{const count=av.participants.length,angle=(Math.PI*2*n/Math.max(count,1))-Math.PI/2,r=13;out[actor]=[av.anchor[0]+Math.cos(angle)*r,av.anchor[1]+Math.sin(angle)*r]})}}for(const op of f.event_visual?.operations||[]){if(op.op==='actor.move_to'&&op.actor&&out[op.actor]){const p=anchorFor(op);if(p)out[op.actor]=p}}return out}
function render(i){idx=Math.max(0,Math.min(FRAMES.length-1,i));const f=FRAMES[idx],positions=actorPositions(f);for(const [id,v] of Object.entries(f.views.actors)){const el=document.querySelector('[data-actor="'+id+'"]');xy(el,positions[id]);const cfg=PROFILE.actors[id],key=cfg.render?.state_binding||Object.keys(v.bindings||{})[0],state=key?bind(v,key):'';el.querySelector('.actor-state').textContent=state??''}

for(const [id,v] of Object.entries(f.views.activities)){const el=document.querySelector('[data-activity="'+id+'"]'),cfg=PROFILE.activities[id],key=cfg.render?.status_binding||'status',state=bind(v,key);xy(el,cfg.anchor);el.querySelector('.activity-state').textContent=state??'';el.classList.toggle('active',state==='active')}

const ev=f.event,vis=f.event_visual;document.getElementById('hud').textContent='tick '+f.tick+' · rev '+f.revision+(ev?' · '+(vis?.label||ev.rule_id||ev.event_id):' · initial state');document.getElementById('bar').style.width=((idx+1)/FRAMES.length*100)+'%'}
function schedule(){clearInterval(timer);if(playing)timer=setInterval(()=>{if(idx>=FRAMES.length-1){playing=false;document.getElementById('toggle').textContent='Play';clearInterval(timer)}else render(idx+1)},900)}document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'Pause':'Play';schedule()};document.getElementById('prev').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx-1)};document.getElementById('next').onclick=()=>{playing=false;document.getElementById('toggle').textContent='Play';schedule();render(idx+1)};document.getElementById('restart').onclick=()=>{playing=true;document.getElementById('toggle').textContent='Pause';render(0);schedule()};const q=new URLSearchParams(location.search),start=Math.max(0,Math.min(FRAMES.length-1,parseInt(q.get('frame')||'0',10)||0));render(start);if(start>0){playing=false;document.getElementById('toggle').textContent='Play'}schedule();
