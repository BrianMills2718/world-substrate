# Information items (src/world_substrate/information.py). Substrate-provided
# component kinds; the Engine's observation filter applies them to any world
# whose entities carry components named "information" / "delivery".

[[entities]]
name = "InformationItem"
what = "A represented piece of information as a canonical entity: content with a source and a channel. Only worlds that choose to represent information have one: the hand-authored Waltzman world and the fixed native-coordination draft template. Generated worlds (World Builder, any-scenario pipeline) have none."
source = "src/world_substrate/information.py:21"
state = ["content, source_id, channel_id, topic", "visibility: direct | public (anything else is never visible)", "active (false until delivered; the source alone sees an inactive item)", "derived_from_info_id"]

[[entities]]
name = "Delivery"
what = "Delivery lineage of one InformationItem to one recipient; one Delivery entity per recipient. A direct item becomes visible to an actor only through a delivered Delivery naming that actor (Engine.observe, engine.py:248)."
source = "src/world_substrate/information.py:34"
state = ["info_id, recipient_id, channel_id", "status: pending | delivered | observed", "delivered_tick"]

# Describe-any-scenario pipeline (spikes/any-scenario-2026-10/, Decision 007).
# Offline scripts; nothing here is deployed or reachable from the World Builder.

[[entities]]
name = "OddModel"
what = "The conceptual model one LLM call writes from the scenario text before any rule exists (ODD protocol): entities with quantitative state, per-tick processes, actor decisions, sensing, stocks with inflows/outflows, assumptions. Handed to the bundle generator only as the odd_brief text, cut to fit the generator's 2,000-character description limit (model_scenario.py:434; MAX_DESCRIPTION_CHARS, scripts/generate_world_bundle.py:29); the brief itself is not saved, only the full ODD in model.json."
source = "spikes/any-scenario-2026-10/model_scenario.py:72"
state = ["purpose, time_step", "entities[] {name, kind actor|object|place, state[] {variable, unit, initial}}", "processes_each_tick[]", "actor_decisions[] {actor, may_attempt, allowed_only_when}", "sensing[] {actor, can_observe, cannot_observe}", "stocks[] {stock, inflows, outflows}", "assumptions[]"]

[[entities]]
name = "ScenarioModel"
what = "Everything the modeling step decided for one scenario (model.json): the scenario text, the ODD, the stock map, every repair round, the final check counts, what the bundle generator said it did not model, and every trace id."
source = "spikes/any-scenario-2026-10/model_scenario.py:463"
state = ["scenario_text, world_kind", "odd (OddModel)", "stock_map[] {stock, field | null, has_inflows, has_outflows}", "repairs[] (RuleChange rows with kept true/false)", "final_check_counts", "not_modeled[] (from generate_world_bundle)", "guidance (ATTEMPT_GUIDANCE)", "traces {odd, bundle, mechanics, sensing, stocks, anomaly}"]

[[entities]]
name = "ScenarioSpec"
what = "The world definition for the default pipeline path (scenario_spec.json): ScenarioSpecV1, ported from Cybernetic Influence v3's ScenarioSpecV2 at 1c1c207 (spikes/any-scenario-2026-10/scenario_spec.py). Filled by one structured LLM call; references checked client-side."
source = "spikes/any-scenario-2026-10/scenario_spec.py:100"
state = ["people[] (Person: profile with goals, beliefs, decision tendencies, capabilities, limitations; memories)", "information_items[] (holder_id, channel_id, recipient_ids, content, apparent_source)", "scheduled_moments[] (tick, every_ticks, participants)", "world_records[] (public/hidden state, visible_to_actor_ids)", "behaviors[] (subject_refs, fidelity_need)", "unsupported[]"]

[[entities]]
name = "Person"
what = "A person or group from the scenario spec, compiled to an actor entity with the `member` component; its profile becomes that agent's brief (model.json briefs, shown to that agent only by run_scenario.py)."
source = "spikes/any-scenario-2026-10/compile_spec.py:105"
state = ["member: role, authorized, approved, aware", "brief (text in model.json, not world state)"]

[[entities]]
name = "ScheduledMoment"
what = "A meeting, review or deadline from the scenario spec, compiled to a `moment` entity: ticks_until counts down each tick (moment-countdown); at 0 it occurs (moment-occurs: occurrences + 1, countdown restarts from every_ticks, -1 = never)."
source = "spikes/any-scenario-2026-10/compile_spec.py:66"
state = ["moment: ticks_until, every_ticks, occurrences"]

[[entities]]
name = "CoverageReport"
what = "Per spec behavior, how the world produces it (coverage.json): exact (a compiled rule), coarse (a generated rule names its action), unsupported; plus the spec's unsupported parts."
source = "spikes/any-scenario-2026-10/compile_spec.py:150"
state = ["rows[] {request_id, behavior, classification, by}", "unsupported[]"]

[[entities]]
name = "SensingMap"
what = "Per actor, the exact bundle fields it can observe (sensing.json), mapped from the ODD's plain-language sensing by one LLM call and validated client-side. Enforced by run_scenario.py on each observation, not by the Engine."
source = "spikes/any-scenario-2026-10/model_scenario.py:110"
state = ["{actor_id: [label.field, ...]}", "_fallback_own_fields_only: actors the mapping left out (they sense only their own entity)"]

[[entities]]
name = "StockFlows"
what = "Stock-and-flow view derived mechanically from bundle + causal model (flows.json): every numeric component path with the rules that add to, subtract from or set it."
source = "spikes/any-scenario-2026-10/model_scenario.py:305"
state = ["stocks{component.field: {initial{entity: value}, inflows[], outflows[], sets[]}}"]

[[entities]]
name = "CheckReport"
what = "Layer-1 checks on a compiled model by simulation through the ordinary Engine (checks.json; checks.r<N>.json per repair round): structure, liveness, attempt_vs_outcome, conservation, boundedness, reachability, deadlock, extreme_conditions, behavior_anomaly."
source = "spikes/any-scenario-2026-10/checks.py:367"
state = ["counts {blocking, advisory, rules, rules_fired, depletable_stocks}", "findings[] {check, blocking, stock | rule, finding}", "extreme_conditions[], behavior_anomalies[]", "seeds, ticks, seconds, step_seconds"]

[[entities]]
name = "RuleChange"
what = "One to three rule changes an LLM proposes in the rule language (replace_mechanic, add_process, replace_process, add_action), merged into a copy and compiled (rule_writer.propose_rule). Used by the layer-1 repair loop (kept only if checks improve) and by the mid-run game master (installed into the running Engine if checks pass, else a one-off ruling)."
source = "spikes/any-scenario-2026-10/rule_writer.py:53"
state = ["proposal {changes[], why, change, target_id}", "repair rows: round, trace, finding, kept, candidate_blocking, blocking_after, cost", "mid-run rows (summary.rules_written_mid_run): intent, trace_id, proposal, checks, status, event_id, written_mid_run, rules_installed | ruling"]

[[entities]]
name = "Resident"
what = "One LLM agent per actor entity, a Concordia EntityAgentWithLogging whose acting component makes one typed llm_client call returning an Attempt. Briefed with the scenario text only (no profile). Wakes only when a categorical observed field or its offered actions change, or an attempt awaits its outcome. In memory only."
source = "spikes/any-scenario-2026-10/run_scenario.py:107"
state = ["ObservationLog: last 6 observations (run_scenario.py:84)", "situation briefing (scenario text)", "cost, calls"]

[[entities]]
name = "Attempt"
what = "One resident decision per wake, in the observation-to-action vocabulary (attempts.jsonl row). The LLM returns the Attempt fields; the runner adds tick, actor, belief_as_of, offered, performed and, from the next observation, observed_effect."
source = "spikes/any-scenario-2026-10/run_scenario.py:50"
state = ["LLM fields: see [pipeline].attempt_fields", "record: tick, actor, belief, belief_as_of, cited_observations, decision (offered | continue | unlisted), expected_effect, offered[], unlisted_intent, performed {action, status, event_id, action_record} | {status continue | no_rule | ruling ...}, observed_effect"]

[[entities]]
name = "ScenarioRun"
what = "One run of a generated model with residents (a run-<stamp>/ folder inside the model folder): every Engine event, every attempt, per-tick process changes, the final observed world, a summary, and the bundle/causal model after mid-run rules."
source = "spikes/any-scenario-2026-10/run_scenario.py:148"
state = ["events.jsonl (every Engine event: submits, advance, game-master rulings)", "attempts.jsonl", "ticks.json [{tick, world_changes}]", "final_world.json (Engine.observe of the first actor)", "summary.json {run_id, trace_id, profile_id, ended terminal|quiescent|max_ticks|run_budget, final_tick, events, attempts, resident_calls, cost, conditions_changed, situation_briefing, resident_model, rules_written_mid_run}", "bundle_after_run.json, causal_after_run.json (only when the game master is on)"]

# --------------------------------------------------------------- processes ---

[[processes]]
name = "describe"
what = "Dialogue helper asks questions and co-writes a description, or invents one (Surprise me)."
source = "scripts/world_dialogue.py:116"
routes = ["POST /clarify", "POST /surprise"]
changes = ["Description"]
writes = []
schedule = "on request; LLM; budget-reserved"

[[processes]]
name = "generate_world"
what = "Description -> AuthoringBundle -> CausalModel (up to 2 attempts, second on a fallback model) -> zero-cost scripted dry run scores each attempt -> best kept."
source = "scripts/world_builder_service.py:725"
routes = ["POST /generate-world"]
changes = ["AuthoringBundle", "CausalModel", "CausalReview"]
writes = ["world-substrate-authoring-bundle/v0"]
schedule = "on request; background job; LLM; budget-reserved"

[[processes]]
name = "generate_draft"
what = "Native-coordination one-shot text -> bounded draft + draft review -> bundle."
source = "scripts/world_builder_service.py:876"
routes = ["POST /generate-draft"]
changes = ["Draft", "AuthoringBundle"]
writes = ["world-substrate-native-coordination-draft/v0", "world-substrate-native-coordination-draft-review/v0", "world-substrate-native-coordination-proposal/v0", "world-substrate-authoring-bundle/v0"]
schedule = "on request; LLM"

[[processes]]
name = "generate_mechanics"
what = "Edited bundle (+ optional guidance) -> new CausalModel proposal, compiled for review. Used by /build."
source = "scripts/world_builder_service.py:915"
routes = ["POST /generate-mechanics"]
changes = ["CausalModel", "CausalReview"]
writes = []
schedule = "on request; LLM; budget-reserved"

[[processes]]
name = "compile"
what = "CausalModel.from_dict validates the proposal against the bundle: schema, action kinds equal bundle kinds, typed paths, selectors, operators, at most 6 processes, unique ids; derives reads/writes. Model-written source is never executed."
source = "src/world_substrate/action_authoring.py:367"
routes = []
changes = ["CausalReview"]
writes = ["world-substrate-causal-model/v0", "world-substrate-action-mechanic/v0", "world-substrate-process-mechanic/v0"]
schedule = "inside generate_world, generate_mechanics, run and compare (every /run recompiles before any policy call)"

[[processes]]
name = "approve"
what = "A person accepts the reviewed CausalModel. Client-side only: the page sets a flag and sends approved:true; the server refuses /run and /compare without it (HTTP 409)."
source = "scripts/world_builder_service.py:997"
routes = []
changes = ["Approval"]
writes = []
schedule = "human click; invalidated in /build when the bundle changes (world_builder_app.js:51)"

[[processes]]
name = "install_freeze"
what = "Each compiled mechanic and process is installed into a MechanicProfile (reject findings stop the run), then the profile is frozen to an identity."
source = "scripts/run_authored_world.py:48"
routes = []
changes = ["MechanicProfile"]
writes = []
schedule = "at the start of every run"

[[processes]]
name = "run"
what = "Fresh or continued run: builds the Engine, then per round each actor (rotating order) discovers offered actions, a policy (scripted first-available, or LLM) picks one, Engine.submit commits or refuses; a lost race retries once; then Engine.advance(1) runs due processes."
source = "scripts/run_authored_world.py:215"
routes = ["POST /run"]
changes = ["World", "Entity", "Run", "Snapshot"]
writes = ["world-substrate-contested-run/v3", "no_action", "nothing_left"]
schedule = "on request; scripted runs synchronous, AI runs as a job; live play asks for 1 round at a time with continue_from"

[[processes]]
name = "act"
what = "Engine.submit/apply: validate envelope -> look up rule -> revision check + rule checks on a detached candidate -> apply -> refuse on engine-owned or out-of-scope writes -> commit (revision+1) or refuse. One event and one command per attempt."
source = "src/world_substrate/engine.py:409"
routes = []
changes = ["World", "Entity"]
writes = ["accepted", "invalid_action", "unsupported_action", "stale_revision", "precondition_failed", "scope_violation", "action", "invalid_action_command"]
schedule = "once per submitted attempt"

[[processes]]
name = "advance"
what = "Engine.advance: tick+1, then every due process (in declared order) applies on a detached candidate; an out-of-scope process write raises and restores the pre-tick world (no event is written)."
source = "src/world_substrate/engine.py:762"
routes = []
changes = ["World", "Entity"]
writes = ["accepted", "advance"]
schedule = "once per round, after all actors"

[[processes]]
name = "project"
what = "build_live_projection packages an initial snapshot and the canonical event list, re-applies every change and checks event ids; SSE encoding streams it."
source = "src/world_substrate/projection.py:44"
routes = []
changes = ["LiveProjection"]
writes = ["world-substrate-live-projection/v0", "world-substrate-snapshot/v1"]
schedule = "native-coordination runs and reference-world builds; not on the authored-world /run path"

[[processes]]
name = "render"
what = "Presentation only. Authored-world runs: bootstrap a scene profile from the trace and render the round replay (render_scene_replay). Projections: build LivingSceneFrames and render them (render_living_scene, render_composed_living_scene)."
source = "scripts/run_authored_world.py:517"
routes = []
changes = ["SceneProfile", "LivingSceneFrame"]
writes = ["world-substrate-scene-profile/v0", "world-substrate-scene-profile-bootstrap/v0", "world-substrate-scene-asset-catalog/v0", "world-substrate-scene-catalog-extension/v0", "world-substrate-living-scene/v1", "world-substrate-replay-studio/v0", "world-substrate-reference-world/v0"]
schedule = "after each run; offline for evidence pages"

[[processes]]
name = "compare"
what = "Native-coordination what-if: requires approval and exactly the reviewed shared coordination mechanics, changes only gate.required_approvals, runs the comparison."
source = "scripts/world_builder_service.py:956"
routes = ["POST /compare-native-coordination"]
changes = ["Comparison"]
writes = ["world-substrate-native-coordination-comparison-change/v0"]
schedule = "on request; deterministic; no LLM"

[[processes]]
