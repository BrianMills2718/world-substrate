[[processes]]
name = "deliver_information"
what = "An actor delivers an InformationItem to a recipient: the rule activates the item and marks the recipient's Delivery delivered, as one Engine transition (act). From then on Engine.observe shows the item to that recipient. Hand-authored Waltzman rule and the fixed native-coordination 'communicate' mechanic; no generator proposes it."
source = "reference_worlds/waltzman/mechanics.py:198"
routes = []
changes = ["InformationItem", "Delivery"]
writes = []
schedule = "per submitted communicate attempt; reference worlds and native-coordination runs only (examples/native_coordination/coordination-causal-v0.json, coordination.action.communicate)"

[[processes]]
name = "model_scenario"
what = "Pipeline layer 1. Default path (--world-def spec, main_spec): scenario text -> ScenarioSpec (one structured LLM call, ScenarioSpecV1 ported from Cybernetic Influence v3) -> compile_spec (no call: people as member actors, one information + pending delivery per recipient with the reviewed communicate rule, scheduled moments as countdown entities with moment-countdown/moment-occurs processes, coverage rows) -> action signatures for the remaining behaviors (one structured call) -> generate_causal_model -> merge (compiled rules win) -> build_engine -> early model.json with per-person briefs -> check_scenario + repair_rules -> flows -> final files; no sensing map (the Engine hides undelivered information). Older path (--world-def odd): scenario text -> OddModel (one LLM call) -> odd_brief appended to the text -> generate_world_bundle -> generate_causal_model (ATTEMPT_GUIDANCE, stronger rule model) -> build_engine compiles and installs (raises on a reject) -> stock map (one LLM call) -> early model.json -> check_scenario + repair_rules -> sensing map (one LLM call) -> flows -> final files. No approval step (G14)."
source = "spikes/any-scenario-2026-10/model_scenario.py:395"
routes = []
changes = ["ScenarioSpec", "CoverageReport", "OddModel", "AuthoringBundle", "CausalModel", "ScenarioModel", "SensingMap", "StockFlows"]
writes = ["scenario_spec.json", "coverage.json", "bundle.json", "causal.json", "model.json", "flows.json", "sensing.json", "checks.json"]
schedule = "offline, by hand (python3 spikes/any-scenario-2026-10/model_scenario.py --name N --text T); --repair-dir reruns checks and repairs on a saved model; refuses to start when spend.py's plan total is within $0.25 of CAP"

[[processes]]
name = "check_scenario"
what = "checks.run_checks: static findings (structure, selectors, attempt-vs-outcome, conservation, outflow coverage, co-location) plus seeded random runs through the ordinary Engine (boundedness, reachability, liveness, deadlock), extreme-conditions runs (each depletable stock at zero, judged by a 3-vote LLM consequence check) and an LLM behavior-anomaly review."
source = "spikes/any-scenario-2026-10/checks.py:367"
routes = []
changes = ["CheckReport"]
writes = ["checks.json", "checks.rN.json"]
schedule = "inside model_scenario (every repair round) and midrun; standalone CLI checks.py --model-dir"

[[processes]]
name = "repair_rules"
what = "repair_loop: up to MAX_REPAIRS (8) rounds of propose (rule_writer, one targeted blocking finding) -> compile -> check -> keep if stable blocking findings fall (or the target is fixed with at most two new ones), else revert; returns the best model seen."
source = "spikes/any-scenario-2026-10/model_scenario.py:329"
routes = []
changes = ["CausalModel", "AuthoringBundle", "RuleChange", "CheckReport"]
writes = ["causal.rN.json", "checks.rN.json"]
schedule = "inside model_scenario"

[[processes]]
name = "run_scenario"
what = "Pipeline layer 2: build_engine from the model folder (optional --set condition changes), register the clock process, then per tick each Resident is woken only on a changed observation (filtered by SensingMap), returns an Attempt, and an offered attempt goes through Engine.submit; an unlisted attempt goes to the game master; then Engine.advance(1). Stops at the terminal, after quiet_ticks with no change, at max_ticks or at the run budget."
source = "spikes/any-scenario-2026-10/run_scenario.py:148"
routes = []
changes = ["World", "Entity", "Resident", "Attempt", "ScenarioRun"]
writes = ["events.jsonl", "attempts.jsonl", "ticks.json", "final_world.json", "summary.json", "causal_after_run.json", "bundle_after_run.json", "accepted", "unsupported_action"]
schedule = "offline, by hand; Concordia gdm-concordia==2.4.0; refuses to start when plan spend + run budget > CAP"

[[processes]]
name = "midrun_rule"
what = "Pipeline layer 3, MidRunGameMaster: for an unlisted attempt, rule_writer proposes general rule(s); run_checks on the whole model; pass (blocking <= baseline, none on the new rule, no conservation finding) -> rules installed into the RUNNING Engine registry and the attempt submitted; fail -> a 'gm-ruling' submit that the Engine records as unsupported_action, with the reason kept in the run record."
source = "spikes/any-scenario-2026-10/midrun.py:59"
routes = []
changes = ["RuleChange", "CausalModel", "AuthoringBundle", "World"]
writes = ["causal_after_run.json", "bundle_after_run.json", "unsupported_action"]
schedule = "inside run_scenario, once per unlisted attempt (unless --no-gm)"

[[processes]]
name = "render_scenario"
what = "render_run.py: converts a run folder into a world-substrate-contested-run/v3 trace (to_trace) and renders it with the World Builder's round replay (run_authored_world.render_run, bootstrapped scene), then inserts a state panel built by replaying events.jsonl onto the bundle's initial values (state_rounds)."
source = "spikes/any-scenario-2026-10/render_run.py:116"
routes = []
changes = ["SceneProfile"]
writes = ["trace.json", "frames.html"]
schedule = "offline, by hand, after a run"

[[processes]]
name = "extreme_probe"
what = "c2_extreme.py: runs the checks on a model and on the same model with one named harm rule removed, and reports whether outflow coverage and the extreme-conditions review tell them apart."
source = "spikes/any-scenario-2026-10/c2_extreme.py:32"
routes = []
changes = ["CheckReport"]
writes = ["c2-*.json"]
schedule = "offline, by hand"

