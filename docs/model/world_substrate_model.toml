[pipeline]
root = "spikes/any-scenario-2026-10"
decision = "docs/decisions/007-any-scenario-path.md"
# Fields of the Attempt record the resident's LLM call returns (run_scenario.py:50).
attempt_fields = ["belief", "cited_observations", "choice", "offered_index", "unlisted_intent", "expected_effect"]
# LLM calls (all through llm_client, trace ids prefixed any-scenario-; spend.py sums them against CAP):
# world-substrate-odd-modeling, the World Builder's bundle and mechanics generators,
# world-substrate-stock-map, -outflow-coverage, -extreme-conditions, -behavior-anomaly,
# -rule-writer, -sensing-map, -resident-attempt.

# Retained evidence folders (spikes/any-scenario-2026-10/evidence/<folder>). Copies of
# model and run folders, some files gzipped or renamed by hand (frame-*.png, *.log).
[[pipeline.evidence]]
folder = "truck"
holds = "Truck scenario: model files, run/ (events, attempts, summary, after-run bundle and causal model with a mid-run tow rule), resident-models/ (two other resident model families)"

[[pipeline.evidence]]
folder = "hospital"
holds = "Hospital scenario: generated/ (model with checks), full/ (model plus c2 extreme-conditions results), run/"

[[pipeline.evidence]]
folder = "linked"
holds = "Linked process participants (PR #136): truck/ and hospital/ models and runs, hospital-pipeline/ and hospital-pipeline-attempts/ (per-round causal and checks files)"

[[pipeline.evidence]]
folder = "scenario-spec"
holds = "ScenarioSpecV1 port (plan scenario-spec-adoption): the recorded Cybernetic Influence pencil draft used by tests/test_scenario_spec.py, and the drift-test output before the model was updated"

[[pipeline.evidence]]
folder = "waltzman"
holds = "Waltzman scenario: model files, pipeline and gate logs, run/ with frames.html (the scenario_replay view probed for VIEW_COVERAGE)"

# ------------------------------------------- substrate kinds a world can carry --

[[substrate_component_kinds]]
name = "information"
meaning = "InformationItem (InformationState)."
writers = [{ file = "src/world_substrate/information.py", function = "<module>", line = 44 }]

[[substrate_component_kinds]]
name = "delivery"
meaning = "Delivery (DeliveryState)."
writers = [{ file = "src/world_substrate/information.py", function = "<module>", line = 45 }]

# How a process resolves a linked participant from its matching entity `it`
# (action_authoring.py:669); "ref:<component>.<field>" (an entity_ref field on it) is
# accepted in addition.
[linked_participants]
source = "src/world_substrate/action_authoring.py:264 (DeclaredProcess.participants), :672 (_process_participants), :733 (_link_bindings)"
links = ["owner_of_it", "owned_by_it", "co_located"]

# Which path can produce each kind of thing a world can represent. Values: yes | no
# | fixed template (only the template's own fixed shape). Evidence per cell: ODD.md 4.1.
[[producing_paths]]
name = "world_builder"
what = "LLM generators behind /generate-world and /generate-mechanics, plus /build edits"

[[producing_paths]]
name = "native_coordination_draft"
what = "POST /generate-draft: bounded draft filled into a fixed bundle template, run under the fixed coordination-causal-v0 mechanics"

[[producing_paths]]
name = "any_scenario_pipeline"
what = "spikes/any-scenario-2026-10 (model_scenario + mid-run rules)"

[[producing_paths]]
name = "hand_authored"
what = "reference_worlds/* Python packs (registered components, Python mechanics and processes)"

[[world_kinds]]
kind = "entity with typed components"
paths = { world_builder = "yes", native_coordination_draft = "fixed template", any_scenario_pipeline = "yes", hand_authored = "yes" }

[[world_kinds]]
kind = "action (checks + effects)"
paths = { world_builder = "yes", native_coordination_draft = "fixed template", any_scenario_pipeline = "yes", hand_authored = "yes" }

[[world_kinds]]
kind = "process (changes the world makes by itself)"
paths = { world_builder = "yes", native_coordination_draft = "no", any_scenario_pipeline = "yes", hand_authored = "yes" }

[[world_kinds]]
kind = "process with linked participants"
paths = { world_builder = "yes", native_coordination_draft = "no", any_scenario_pipeline = "yes", hand_authored = "no" }

[[world_kinds]]
kind = "relationship as an entity_ref field or owner_ref"
paths = { world_builder = "yes", native_coordination_draft = "fixed template", any_scenario_pipeline = "yes", hand_authored = "yes" }

[[world_kinds]]
kind = "information item + per-recipient delivery"
paths = { world_builder = "no", native_coordination_draft = "fixed template", any_scenario_pipeline = "no", hand_authored = "yes" }

[[world_kinds]]
kind = "per-actor sensing map (field-level observation filter)"
paths = { world_builder = "no", native_coordination_draft = "no", any_scenario_pipeline = "yes", hand_authored = "no" }

[[world_kinds]]
kind = "person with a behavioral profile"
paths = { world_builder = "no", native_coordination_draft = "no", any_scenario_pipeline = "no", hand_authored = "no" }

[[world_kinds]]
kind = "scheduled moment"
paths = { world_builder = "no", native_coordination_draft = "no", any_scenario_pipeline = "no", hand_authored = "no" }

# ------------------------------------------------------------------ run log --

[run_log]
writer = "scripts/world_builder_service.py:376 (_record_response)"
file = "<WORLD_BUILDER_RUN_LOG_DIR or ~/.local/state/world-builder/runs>/runs_<UTC date>.jsonl"
logged_paths = ["/generate-world", "/run", "/clarify", "/surprise", "/generate-draft", "/generate-mechanics", "/compare-native-coordination"]
# Paths whose result keeps a real summary. The other logged paths keep only the
# sorted response key names (world_builder_service.py:374): see gap G4.
summarised_paths = ["/generate-world", "/run", "/clarify", "/surprise"]

