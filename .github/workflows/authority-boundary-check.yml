name: authority-boundary-check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full unittest suite
        run: python -m unittest discover -s tests
      - name: Project checks
        run: python scripts/check_project.py
