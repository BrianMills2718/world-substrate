# Machine-checkable trace from the system model (docs/model/ODD.md) to code and tests.
# Each rule names exactly one owner path, at least one test written as path::test_name,
# and the decision record it implements. The AES durable-docs checker verifies that every
# owner, test function and decision exists, and flags a rule as stale when its owner
# changes after this file was last committed (or after a rule's reviewed_at commit).
schema_version: "0.1"
scope: >-
  The World Substrate software system (engine, authoring compiler, installer, World Builder
  service, projection), not any world it hosts. Entities and processes follow ODD.md sections 4, 5 and 8.

entities:
  - id: ENT-WORLD
    what: canonical typed world state with a material hash and a revision counter (ODD 4)
  - id: ENT-ACTION-ENVELOPE
    what: a policy's submitted intent, validated before any rule runs; with open attempts, the typed reading of a resident's own words, or an unmatched-attempt envelope carrying them (ODD 4, 8.1, 11.3)
  - id: ENT-RULE-PROPOSAL
    what: a model-authored mechanics proposal awaiting compiler review (ODD 4, 8.6)
  - id: ENT-FROZEN-PROFILE
    what: the reviewed, approved and frozen set of installed rules and processes for one run (ODD 4, 8.7)
  - id: ENT-EVENT
    what: a committed or refused transition record with stable id and causal parents (ODD 4, 8.4)
  - id: ENT-RUN-RECORD
    what: the normal-storage log of one build or run, with review findings or legacy review errors and exact ordinary/failed actor inputs; declared candidates require the additional complete privacy verdict (ODD 8.13, 8.22, 11.6)
  - id: ENT-INFORMATION-ITEM
    what: represented information with visibility per observer, kept out of causal parentage (ODD 8.14)

processes:
  - id: PROC-TRANSITION
    what: validate an action envelope, run the installed rule, commit all writes or refuse (engine.py transition)
    enforces: [RULE-ATOMIC-COMMIT-OR-REFUSAL, RULE-WRITE-SCOPE, RULE-CHECKS-ARE-READ-ONLY]
  - id: PROC-PROCESS-TICK
    what: run due processes on the shared world clock with rollback on violation (engine.py process tick)
    enforces: [RULE-WRITE-SCOPE, RULE-CHECKS-ARE-READ-ONLY]
  - id: PROC-COMPILE-REVIEW
    what: compile a model proposal into rules with derived authority for human review (action_authoring.py)
    enforces: [RULE-DERIVED-AUTHORITY]
  - id: PROC-INSTALL-AND-RUN
    what: freeze the approved profile and run residents through it (run_authored_world.py)
    enforces: [RULE-FROZEN-PROFILE, RULE-DECLARED-ACTOR-INPUTS]
  - id: PROC-BUILDER-REQUEST
    what: serve build, generate, approve and run requests behind approval and budget gates (world_builder_service.py)
    enforces: [RULE-APPROVAL-BEFORE-RUN, RULE-BUDGET-FAILS-CLOSED, RULE-DURABLE-RUN-RECORD, RULE-ACTOR-INPUT-REVIEW]
  - id: PROC-LIVE-PROJECTION
    what: rebuild the live view from snapshot plus canonical event deltas (projection.py)
    enforces: [RULE-PROJECTION-FROM-CANONICAL-ONLY]
  - id: PROC-INFORMATION-VISIBILITY
    what: decide which observer sees which information item (information.py)
    enforces: [RULE-INFORMATION-IS-NOT-CAUSE]

rules:
  - id: RULE-ATOMIC-COMMIT-OR-REFUSAL
    statement: >-
      A transition either commits every write and increments the world revision once, or is refused
      (malformed envelope, stale revision, knock-on effects past the reaction limit the run records (32 for a
      run saved before J0 of the AI judge plan; new runs have none), a step that breaks a declared law) with the
      material hash
      unchanged and the refusal recorded.
    owner: src/world_substrate/engine.py
    reviewed_at: 4878cb84ffabf9d8dfaad4472ff9c64036673aeb  # re-read 2026-11-10 (ai-judge J0, PR #362): the reaction-limit refusal now applies only under a recorded limit (Engine(reaction_limit=...)), still through _refuse_round with the world restored; a blocked knock-on step is recorded without writing anything; tests below plus tests/test_knock_on_unbounded.py
    checks:
      - tests/test_action_envelopes.py::test_malformed_envelope_is_invalid_atomic_and_replayable
      - tests/test_first_fill.py::test_stale_revision_is_rejected_without_material_change
      - tests/test_open_attempt.py::test_a_chain_past_the_reaction_limit_is_refused_whole
      - tests/test_open_attempt.py::test_a_reaction_that_keeps_itself_due_fires_once_per_moment
      - tests/test_open_attempt.py::test_a_round_whose_reactions_do_not_settle_is_undone
      - tests/test_laws.py::test_a_sale_that_takes_no_money_is_refused_and_names_the_law
      - tests/test_laws.py::test_a_knock_on_effect_that_breaks_a_law_refuses_the_whole_move
      - tests/test_laws.py::test_a_tick_process_that_breaks_a_law_undoes_the_round
    decisions:
      - docs/decisions/003-semantic-mechanical-boundary.md
      - docs/decisions/009-same-moment-knock-on-effects.md
  - id: RULE-WRITE-SCOPE
    statement: >-
      A rule or process may write only the components it declared; reaching undeclared state refuses the
      action or stops the tick with nothing changed, and the refusal replays identically.
    owner: src/world_substrate/engine.py
    reviewed_at: 4878cb84ffabf9d8dfaad4472ff9c64036673aeb  # re-read 2026-11-10 (ai-judge J0, PR #362): J0 changed how many reactions a moment may run and what is recorded, not the scope checks in _apply_process, which still run on every write
    checks:
      - tests/test_write_scope.py::test_action_reaching_undeclared_components_is_refused
      - tests/test_write_scope.py::test_process_reaching_undeclared_state_stops_the_tick
      - tests/test_write_scope.py::test_a_refused_scope_violation_replays_identically
      - tests/test_linked_process_participants.py::test_out_of_scope_linked_write_is_refused_with_nothing_changed
    decisions:
      - docs/decisions/003-semantic-mechanical-boundary.md
  - id: RULE-CHECKS-ARE-READ-ONLY
    statement: >-
      Precondition checks and process due-tests only read; one that writes is refused and the tick is rolled back.
    owner: src/world_substrate/engine.py
    reviewed_at: 4878cb84ffabf9d8dfaad4472ff9c64036673aeb  # re-read 2026-11-10 (ai-judge J0, PR #362): the new near_misses (blocked knock-on steps) only compares check values on the moment's view and returns rows; checks and due-tests still run read-only
    checks:
      - tests/test_rule_authority.py::test_checks_are_refused_if_they_write
      - tests/test_rule_authority.py::test_due_cannot_write_and_the_tick_is_rolled_back
    decisions:
      - docs/decisions/003-semantic-mechanical-boundary.md
  - id: RULE-DERIVED-AUTHORITY
    statement: >-
      The authority shown for review is derived by the compiler from the proposed rule, not taken from the
      model's claims; unknown effect paths and engine-owned fields are rejected before installation.
    owner: src/world_substrate/action_authoring.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba  # source review I0/I1: DeclaredActionMechanic.from_dict validates selectors/signatures/checks/effects, derives reads/writes; append_report is action-only and typed, adds target read/write, and cannot author engine cause ids
    checks:
      - tests/test_action_authoring.py::test_review_exposes_derived_authority_not_model_claimed_authority
      - tests/test_action_authoring.py::test_unknown_effect_path_is_rejected_before_installation
      - tests/test_action_authoring.py::test_engine_owned_cause_id_cannot_be_authored_as_effect
    decisions:
      - docs/decisions/006-governed-rules-layer-scope.md
  - id: RULE-FROZEN-PROFILE
    statement: >-
      The compiled profile is frozen before each run_world invocation starts, and a mechanic rejected by the
      compiler/installer never reaches runtime. J3 ruling-origin rules extend the effective rule set separately;
      continuation reconstructs that effective set before freezing a new profile. The originally supplied bundle
      remains the approval identity. See openspec/specs/ai-judge/spec.md for the additional installation contract.
    owner: scripts/run_authored_world.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba  # source review I0/I1: run_world resolves effective Rulebook then build_engine validates/installs all rules and freezes before policy construction; continuation validates world/rule identities; new actor-input sink does not change profile authority
    checks:
      - tests/test_run_authored_world.py::test_compiled_profile_is_frozen_before_run
      - tests/test_run_authored_world.py::test_unreviewable_mechanic_never_reaches_runtime
    decisions:
      - docs/decisions/007-any-scenario-path.md
  - id: RULE-APPROVAL-BEFORE-RUN
    statement: >-
      The World Builder run endpoint requires approved=true and compiles the submitted mechanics before a
      policy call; native coordination also requires the exact reviewed shared causal model. Continuation
      verifies a server seal over the snapshot, original bundle/rules, approval and retained rulings.
      Create simulation supplies initial approval; J3 permits checked additional rules under the chosen mode.
      This is rule approval, not the represented people's consent to an exchange (the latter remains Q96).
    owner: scripts/world_builder_service.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba  # source review I0/I1: _run requires approved and compiles before policy calls, keeps exact native law, validates snapshot seal including declared actor_state and rejects unsealed/conflicting restored inputs; actor consent remains a separate modeled action
    checks:
      - tests/test_world_builder_service.py::test_run_requires_explicit_mechanic_approval
      - tests/test_world_builder_service.py::test_native_coordination_run_refuses_modified_law
      - tests/test_world_builder_service.py::test_generate_endpoint_returns_compiler_review_not_unchecked_model_output
    decisions:
      - docs/decisions/005-native-waltzman-delivery.md
  - id: RULE-BUDGET-FAILS-CLOSED
    statement: >-
      A public request cannot select an unapproved model. Before admitting an AI build/run request the service
      reserves at most the remaining daily allowance, refuses admission when exhausted, and refuses spend
      when the ledger is unreadable. It settles recorded cost, or retains the reserved charge when accounting
      is unavailable. This verifies the outer admission gate, not a hard aggregate cap across every downstream call.
    verification_limit: >-
      The stronger no-call-past-budget invariant requires a separate audit of downstream model-call budgets,
      concurrency and late hedges; the cited request-level tests do not establish it.
    owner: scripts/world_builder_service.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba  # source review I0/I1: _requested_model, _load_budget_state, _reserve_daily_budget, _llm_budget and settlement retain fail-closed admission; no stronger downstream aggregate-cap claim is made
    checks:
      - tests/test_world_builder_service.py::test_unapproved_model_is_refused_before_spend
      - tests/test_world_builder_service.py::test_corrupt_budget_ledger_fails_closed_before_model_call
      - tests/test_world_builder_service.py::test_daily_budget_caps_next_llm_request_instead_of_overshooting
    decisions:
      - docs/decisions/004-product-and-adoption-strategy.md
  - id: RULE-DURABLE-RUN-RECORD
    statement: >-
      With writable run-log storage, build/run responses append a daily JSONL record containing request, result
      and trace identity; asynchronous jobs log their final result. Keep going verifies a sealed final snapshot
      before continuing under the corresponding rules and approval.
    unmet_requirement: >-
      Every run should remain durably auditable even on storage failure. Current _record_response catches log-write
      errors and prints them without failing the request; successful response does not guarantee a retained record.
      The cited tests cover normal storage and snapshot continuation, not failure of the log store.
    owner: scripts/world_builder_service.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba  # source review I0/I1: _record_response retains exact failed actor inputs through shared sink and normal-storage run records; continuation seals include actor_state; log-write errors are still swallowed, so storage-failure durability remains unmet
    checks:
      - tests/test_world_builder_service.py::test_every_build_and_run_leaves_a_durable_record
      - tests/test_world_builder_service.py::test_keep_going_continues_from_the_final_snapshot
    decisions:
      - docs/decisions/002-observability-and-replay.md
  - id: RULE-PROJECTION-FROM-CANONICAL-ONLY
    statement: >-
      The live view is rebuilt only from a canonical snapshot plus event deltas, reconstructs each branch exactly,
      and keeps stable event ids.
    owner: src/world_substrate/projection.py
    checks:
      - tests/test_waltzman_projection.py::test_snapshot_plus_event_deltas_reconstruct_each_canonical_branch_exactly
      - tests/test_waltzman_projection.py::test_projection_preserves_stable_event_ids_and_branch_prefix
    decisions:
      - docs/decisions/002-observability-and-replay.md
  - id: RULE-INFORMATION-IS-NOT-CAUSE
    statement: >-
      Only authorized observers see an information item's content, and information context never becomes causal parentage.
    owner: src/world_substrate/information.py
    checks:
      - tests/test_living_scene_information_feedback.py::test_authorized_observer_sees_content_and_unauthorized_observer_does_not
      - tests/test_living_scene_information_feedback.py::test_information_context_does_not_become_causal_parentage
    decisions:
      - docs/decisions/003-semantic-mechanical-boundary.md

  - id: RULE-DECLARED-ACTOR-INPUTS
    statement: >-
      Worlds declaring actor_information assemble both policy paths from explicit actor grants, public setup
      and the actor's own retained state. Private existence, undelivered reports, hidden action arguments and
      privileged refusal details do not enter that context. Historical worlds are explicitly legacy-unrestricted.
    verification_limit: >-
      This is a resident-input boundary, not generic Engine read-scope enforcement or proof that a generated
      declaration is semantically authorized. The source-grounded review gate has its own rule and limitation.
    owner: scripts/actor_information.py
    reviewed_at: f4b7afab183691df0e364a624a275876bcddb9ba
    checks:
      - tests/test_actor_information.py::test_hidden_state_labels_summary_and_action_text_cannot_change_input
      - tests/test_actor_information.py::test_pending_message_and_its_action_identity_do_not_enter_recipient_input
      - tests/test_actor_information.py::test_private_entity_identity_and_action_forms_are_recipient_scoped
      - tests/test_resident_context_trace.py::test_runner_uses_declaration_instead_of_omniscient_context
      - tests/test_world_builder_service.py::test_declared_actor_continuation_seals_all_policy_inputs
    decisions:
      - docs/decisions/003-semantic-mechanical-boundary.md
  - id: RULE-ACTOR-INPUT-REVIEW
    statement: >-
      The existing build review inspects exact initial actor contexts against the original source. A declared
      candidate requires a complete explicit authorized verdict for its public summary and every actor;
      missing, malformed, rejected or unavailable review prevents delivery on both build paths.
    verification_limit: >-
      Typed gate tests establish that unsafe or absent verdicts are rejected, not that the model always detects
      unauthorized disclosures. Generated verdicts and actual prompts require trace inspection.
    owner: scripts/review_rules.py
    reviewed_at: 2fa9b86f4bef279cfb7b6541fd38132806a1455a
    checks:
      - tests/test_initial_actor_knowledge.py::test_missing_malformed_or_disallowed_review_never_approves
      - tests/test_initial_actor_knowledge.py::test_existing_review_call_reads_actual_contexts_and_rejects_narrator_negative_knowledge
      - tests/test_world_builder_service.py::test_declared_actor_world_is_not_delivered_after_privacy_review_failure
    decisions:
      - docs/decisions/008-build-worlds-in-an-agent-harness.md
  - id: RULE-INDEPENDENT-CONCERN-PROCEDURE
    statement: >-
      The independent_decision procedure records condition, report exposure, actor-owned stance and assent,
      validation and institutional hold separately. Passing validation clears only the technical hold;
      activation still requires the declared actors' own assents. Legacy scripted decisions remain explicit.
    verification_limit: >-
      These are declared procedural assumptions with a bounded effective repair action; they establish neither
      scientific fidelity of the condition nor calibrated human responses or a required social ending.
    owner: spikes/any-scenario-2026-10/compile_spec.py
    reviewed_at: 2fa9b86f4bef279cfb7b6541fd38132806a1455a
    checks:
      - tests/test_scenario_spec.py::test_delivery_review_repair_and_assent_remain_distinct
      - tests/test_scenario_spec.py::test_no_forced_support_timer_or_claim_truth_and_safe_metadata
      - tests/test_actor_report_delivery.py::test_new_actor_report_records_exposure_without_persuasion_or_physical_effect
      - tests/test_actor_report_delivery.py::test_initial_exposure_does_not_invent_a_sender
      - tests/test_independent_rule_authority.py::test_proposed_rule_is_refused_for_preview_install_and_restoration
    decisions:
      - docs/decisions/006-governed-rules-layer-scope.md
