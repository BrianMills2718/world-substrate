<script type="application/json" id="page-data">{"md": {}, "graphs": {"graph": {"schema": "typed-graph/v1", "kinds": {"Substrate": {"label": "Substrate code (every world)", "color": "#1f4e79", "explain": "Fixed code every world runs through: the Engine, compiler, run loop, service, records."}, "Family": {"label": "Fixed people-world part", "color": "#3b6fa8", "explain": "Reusable compiled people-world parts; the scenario explicitly chooses the legacy decision family or the independent validation/assent procedure. Not every family applies to every world."}, "PerWorld": {"label": "Written per world by an AI", "color": "#d9822b", "explain": "Not code: an AI writes it for each described world during the build."}, "Reference": {"label": "Reference worlds code only", "color": "#7a8491", "explain": "Hand-written code for the reference worlds (Kitchen, Waltzman and others); no generated world uses it today."}, "Theory": {"label": "In documents only", "color": "#8a8a8a", "dashed": true, "explain": "Named in decisions or the roadmap, not on the live path."}}, "nodes": [{"id": "world", "label": "World", "kind": "Substrate", "explain": "The one canonical world during a run: entities with typed components, a tick and a revision. Code: src/world_substrate/model.py:424."}, {"id": "engine", "label": "Engine", "kind": "Substrate", "explain": "Applies each attempt atomically or refuses it with a recorded reason; runs due processes each tick. Code: src/world_substrate/engine.py:222."}, {"id": "event", "label": "Event", "kind": "Substrate", "explain": "The record of one attempt or process step: status, checks, changes, an id like r14-e00012. Code: src/world_substrate/engine.py:572."}, {"id": "move", "label": "Move (action)", "kind": "Substrate", "explain": "Something a person may try; its rule has checks and effects, compiled before use. Code: src/world_substrate/action_authoring.py:50."}, {"id": "process", "label": "Process", "kind": "Substrate", "explain": "A rule the world runs by itself when its checks hold: each round by default, or at once as a knock-on effect when marked immediately. Code: src/world_substrate/engine.py:1095."}, {"id": "compiler", "label": "Compiler", "kind": "Substrate", "explain": "Turns proposed rules into installed rules and derives what each may read and write. Code: src/world_substrate/action_authoring.py:440."}, {"id": "policy", "label": "Policy", "kind": "Substrate", "explain": "What chooses a person's move: scripted or an AI model picks an offered move; a resident on the live path says an attempt in its own words. Installed mechanics, not its words, decide what happens. Code: src/world_substrate/policy.py:50."}, {"id": "sense", "label": "Linguistic Core sense and roles", "kind": "Substrate", "explain": "The meaning and participant roles of a move kind, supplied by Linguistic Core; never its effects, quantities or timing. Code: src/world_substrate/semantic.py:15."}, {"id": "profile", "label": "Frozen mechanic profile", "kind": "Substrate", "explain": "The validated, installed rules of a world, frozen under one id before any run; changing a rule means a new profile. Code: src/world_substrate/profile.py:249."}, {"id": "write-scope", "label": "Declared write scope", "kind": "Substrate", "explain": "The fields a rule says it may change; the Engine refuses any change outside them. Read scopes are recorded, not enforced. Code: src/world_substrate/engine.py:136."}, {"id": "causal-trace", "label": "Causal trace", "kind": "Substrate", "explain": "The retained chain of events of a run, each naming the move or process, its checks and its changes; the evidence for any claim about a run. Code: src/world_substrate/engine.py:572."}, {"id": "world-kind", "label": "World kind", "kind": "Substrate", "explain": "Two choices a build makes first: whether the description is about people (people path) or things (causal path), and whether the world is a task, ongoing or open. Code: scripts/world_builder_service.py:121."}, {"id": "builder", "label": "World Builder and its bundle", "kind": "Substrate", "explain": "The public page and service where a person describes a world, approves its rules and watches it run; a build's output is an authoring bundle. Code: scripts/world_builder_service.py."}, {"id": "approval", "label": "Approval record", "kind": "Substrate", "explain": "A person's yes to the rules, stored with the rules' profile id and world fingerprint; every round names it. Code: scripts/world_builder_service.py:426."}, {"id": "fingerprint", "label": "World fingerprint", "kind": "Substrate", "explain": "A short hash of the bundle and rules that ties builds, rounds and shares to one world. Code: scripts/world_builder_service.py:389."}, {"id": "information", "label": "Information item", "kind": "Substrate", "explain": "A represented item with a source and per-recipient deliveries. The source can know it before delivery; other actors receive only authorized public or delivered exposure. Claim content does not become technical truth or assent. Code: src/world_substrate/information.py:57."}, {"id": "run-loop", "label": "Run loop", "kind": "Substrate", "explain": "Each round: everyone decides, picks are submitted in a rotating order, then processes run. Code: scripts/run_authored_world.py:700."}, {"id": "contention", "label": "Lost race", "kind": "Substrate", "explain": "When an earlier move this round changed the state, an open attempt is resubmitted as is at the new revision and only its rule's checks decide it; menu paths resubmit the move if still offered, else ask once more. The refused row names the failed checks, not the event that blocked it. Code: scripts/run_authored_world.py:850."}, {"id": "resident", "label": "Resident", "kind": "Substrate", "explain": "One Concordia AI agent per person: sees its brief, memory and what it can see, and answers belief, attempt (in its own words), expected effect and work; the older menu reply picks an offered move. Code: scripts/concordia_residents.py:44."}, {"id": "task", "label": "Task", "kind": "Substrate", "explain": "A watched field value that takes several rounds, started by a person or the world, ended by a process: finished or failed part-way. Code: scripts/attempts.py:17."}, {"id": "notice", "label": "Finished-task notice", "kind": "Substrate", "explain": "What the other people a finished task names are told, in the starter's own words about the work. Code: scripts/attempts.py:234."}, {"id": "build", "label": "Build", "kind": "Substrate", "explain": "Description to spec, actions, rules, assembly, scripted test run and score. Code: scripts/world_builder_service.py:1635."}, {"id": "rules-retry", "label": "Rules retry", "kind": "Substrate", "explain": "A second rules attempt after a rejection or weak score; skipped after 80 s. Code: scripts/world_builder_service.py:110."}, {"id": "test-run", "label": "Scripted test run", "kind": "Substrate", "explain": "The build's free run with simple moves that scores the rules and lists long tasks and whether each can fail part-way. Code: scripts/world_builder_service.py:1844."}, {"id": "run-log", "label": "Run log", "kind": "Substrate", "explain": "One line per request with its trace ids, cost and full artifacts; the source for shares and trace reads. Code: scripts/world_builder_service.py:542."}, {"id": "readout", "label": "Readout", "kind": "Substrate", "explain": "One AI summary of a run whose every cited event id is checked against the run. Code: scripts/run_readout.py:113."}, {"id": "scene-replay", "label": "Scene replay", "kind": "Substrate", "explain": "The page's round-by-round picture of a run: who did what and said what, rebuilt from the run rows; it already quotes a retry's own words. Code: scripts/render_scene_replay.py:449."}, {"id": "share", "label": "Share link and replay", "kind": "Substrate", "explain": "A saved run rebuilt from the run log that a visitor replays with no AI calls. Code: scripts/world_builder_service.py:638."}, {"id": "budget", "label": "Daily allowance", "kind": "Substrate", "explain": "Visitor $3/day, owner $5/day; spend fails closed. Code: scripts/world_builder_service.py:57."}, {"id": "people-world", "label": "People world", "kind": "Family", "explain": "A world built from a description about people: people, information, moments and the fixed people rules. Code: scripts/people_world.py:474."}, {"id": "communicate", "label": "Communicate rule", "kind": "Family", "explain": "The reviewed move that delivers an information item to its recipient. Spike code: it lives in spikes/any-scenario-2026-10/, which the live build loads through scripts/people_world.py:73. Code: spikes/any-scenario-2026-10/compile_spec.py:56."}, {"id": "moment", "label": "Scheduled moment", "kind": "Family", "explain": "A countdown that happens every so many rounds (a weekly meeting, a deadline). Spike code: it lives in spikes/any-scenario-2026-10/, which the live build loads through scripts/people_world.py:73. Code: spikes/any-scenario-2026-10/compile_spec.py:48."}, {"id": "work-cycle", "label": "Work cycle", "kind": "Family", "explain": "Each action at most once per person per cycle of at least 3 rounds. Code: spikes/any-scenario-2026-10/compile_spec.py:517."}, {"id": "group-decision", "label": "Group decision", "kind": "Family", "explain": "The legacy scripted decision family with support, deadline, deployment and operating review; distinct from the independent validation/assent procedure. Its fixed support/remedy dynamics are fixture assumptions, not general persuasion. Code: spikes/any-scenario-2026-10/compile_spec.py:86."}, {"id": "concern", "label": "Concern", "kind": "Family", "explain": "The legacy scripted concern record on a delivered item: open, under remedy or resolved, with answered and remedy_by. Distinct from an independent actor expressing concern without a forced support change. Code: spikes/any-scenario-2026-10/compile_spec.py:70."}, {"id": "support", "label": "Support", "kind": "Family", "explain": "The legacy decision family's support record: none, full or conditional on a concern. Independent expressed stance and recorded assent use separate records instead. Code: spikes/any-scenario-2026-10/compile_spec.py:66."}, {"id": "remedy", "label": "Remedy", "kind": "Family", "explain": "The legacy scripted concern-remedy task, stipulated to take 2 rounds and stoppable by the holder. It is not the independent procedure's technical repair or validation result. Code: spikes/any-scenario-2026-10/compile_spec.py:332."}, {"id": "agenda", "label": "Agenda count", "kind": "Family", "explain": "group_decision.agenda_items: a bare number of matters put before the decision; an item has no content. Declared in the group-decision component and changed by the compiled put-matter-on-agenda and settle-agenda-matter rules. Code: spikes/any-scenario-2026-10/compile_spec.py:101."}, {"id": "rollout", "label": "Rollout", "kind": "Family", "explain": "The deployment the world starts when the decision is authorized: 6 rounds, suspended if support falls. Its processes (authorization-withdrawn, deployment-completes, deployment-suspended, deployment-resumes, deployment-progresses) are defined in _decision_rules. Code: spikes/any-scenario-2026-10/compile_spec.py:436."}, {"id": "review", "label": "Operating review", "kind": "Family", "explain": "The legacy scripted operating review every 6 rounds after deployment; may reopen each resolved concern once. Distinct from independent technical validation and build-time rules review. Code: spikes/any-scenario-2026-10/compile_spec.py:442."}, {"id": "person", "label": "Person and brief", "kind": "PerWorld", "explain": "A person the spec names, with goals and beliefs, and the brief only their own resident reads. Code: spikes/any-scenario-2026-10/scenario_spec.py:41."}, {"id": "gen-rules", "label": "Generated actions and rules", "kind": "PerWorld", "explain": "The moves and processes the fixed parts do not cover, written by the rules-writing AI and compiled. Code: scripts/people_world.py:251."}, {"id": "waltzman-ref", "label": "Waltzman reference components", "kind": "Reference", "explain": "Trust, risk, readiness and commitment components and analyses of the hand-written Waltzman world. Code: reference_worlds/waltzman/components.py:11."}, {"id": "harness-build", "label": "Build in an agent harness", "kind": "Theory", "explain": "Decision 008: worlds built by an agent that drafts, checks and edits; scripts/world_harness.py exists but the live service does not call it. Code: scripts/world_harness.py."}, {"id": "law-fingerprint", "label": "Executable-law fingerprint", "kind": "Theory", "explain": "Roadmap hardening item: fingerprint the exact executable law and compiler version. Code: none yet."}, {"id": "affordance", "label": "Affordance (offered move)", "kind": "Substrate", "explain": "A move the rules say a person can try now, with its open fields; the page a decider picks from or an attempt is read against. Code: src/world_substrate/engine.py:395."}, {"id": "check", "label": "Check", "kind": "Substrate", "explain": "One condition on a move or process (actual versus required); a move commits only when every check holds, else the event records which failed. Code: src/world_substrate/rules.py:48."}, {"id": "attempt", "label": "Attempt (in own words)", "kind": "Substrate", "explain": "What a resident says it physically tries, in its own words, with no outcome field: the world, not the speaker, decides what happens. Code: src/world_substrate/attempt.py:221."}, {"id": "attempt-reading", "label": "Attempt reading", "kind": "Substrate", "explain": "The interpreter's typed reading of the whole attempt: one operation kind and quoted field rows, or wait; fresh readings include a quoted coverage assessment. Invalid/incomplete/unread assessments are interpretation rejections with safe clarification and no partial action, judge or request delivery. Complete unsupported operations remain missing-rule cases; historical absent assessments remain unassessed. Public example bindings aid person/object reference resolution without hidden fillers; full operation meaning includes polarity. Coverage is model evidence, not proof of semantic truth. Code: src/world_substrate/attempt.py:92."}, {"id": "unmatched-attempt", "label": "Unmatched attempt", "kind": "Substrate", "explain": "An attempt no move kind covers: it changes nothing, the person learns nothing came of it, and the run lists it for the rules writer. Code: src/world_substrate/attempt.py:34."}, {"id": "observation", "label": "Observation", "kind": "Substrate", "explain": "What one actor is supplied this round. Declared actor-information worlds use explicit grants and their own retained context; historical legacy-unrestricted worlds lack that complete boundary. Engine co-location and item filtering alone do not establish secrecy. Code: src/world_substrate/engine.py:278."}, {"id": "place-way", "label": "Place and way", "kind": "PerWorld", "explain": "Where things are, and what lies between two places (a door, a brick wall) with whether it is passable; written per world as entities from the bundle contract, and the move rule checks the way. Code: scripts/generate_world_bundle.py:96."}, {"id": "knock-on-now", "label": "Knock-on that runs now", "kind": "Substrate", "explain": "A process marked 'immediately' runs in waves inside the same moment as the attempt or round step that set it off, until nothing more is due (a glass falls, breaks, the water spills, the neighbour hears it); each pair of process and thing fires once per moment, which is what ends every chain; new runs have no other cap (J0 of the AI judge plan), a step a failed check stops is recorded with its blocker, and a run recorded before J0 replays under its old cap of 32. Code: src/world_substrate/engine.py:964."}, {"id": "skill-roll", "label": "Skill roll", "kind": "Theory", "explain": "Plan S3: a move's outcome depends on a seeded, recorded roll against the person's skill, so someone untrained who flies a helicopter can crash it. Code: none yet."}, {"id": "projection", "label": "Living projection", "kind": "Substrate", "explain": "The read-only living client, JSON and server-sent events rebuilt from canonical snapshots and events; it never changes the world. Code: src/world_substrate/projection.py:44."}, {"id": "causal-parent", "label": "Hard causal parent", "kind": "Substrate", "explain": "An earlier event a rule declares as mechanically supporting this one; kept apart from the information a person merely had in mind. Code: src/world_substrate/rules.py:383."}, {"id": "exchange", "label": "Derived exchange", "kind": "Substrate", "explain": "A composite reading (two give events make one exchange) derived from committed events, never a second effect. Code: src/world_substrate/exchange.py:68."}, {"id": "mechanisms", "label": "Mechanisms library", "kind": "Reference", "explain": "Reusable hand-written rule families (liquid, ownership, thermal, damage, time) that reference worlds such as Castaway register (reference_worlds/castaway/overheat.py:14); generated worlds get only their compiled mechanics and processes (scripts/run_authored_world.py:71, Q28). Code: src/world_substrate/mechanisms/__init__.py:3."}, {"id": "kitchen", "label": "Kitchen flagship", "kind": "Reference", "explain": "The replicated scarce-knife watched world: hand-written rules of its own on the ordinary Engine. Code: reference_worlds/kitchen/mechanics.py."}, {"id": "mechanic", "label": "Installed mechanic", "kind": "Substrate", "explain": "One installed action rule: an action kind's selector, checks, effects and derived reads and writes, compiled and frozen in the profile; the root rule says installed mechanics alone decide what happens. Code: src/world_substrate/action_authoring.py:515."}, {"id": "entity-component", "label": "Entity and component", "kind": "Substrate", "explain": "An entity is one thing in the world (person, wall, glass, decision) with an id, a label, categories and typed components; a component is a named record of typed fields (boundary.passable, group_decision.status) that checks read and effects write. Code: src/world_substrate/model.py:247."}, {"id": "run-seed", "label": "Run seed", "kind": "Theory", "explain": "Plan S3: one seed drawn when a run starts and recorded in the run record; each roll's dice come from hash(run seed, event id) and are recorded, so a replay reads the dice and never rolls (Q33). Code: none yet."}, {"id": "world-law", "label": "Declared world law", "kind": "PerWorld", "explain": "Plan declared-laws S1 (built): a law the AI writes when it designs a world, in that world's own terms: a resource whose total only named moves may change (pencils are made only by the factory's make move), or a move meaning such as 'a purchase moves goods one way and payment the other'. Never a fixed list of move types. The bundle validator checks each law's shape; the rules writer is given the laws and told to keep them; the engine keeps them at every commit (S2, built). Code: scripts/scaffold_world.py:45."}, {"id": "law-check", "label": "Law check", "kind": "Substrate", "explain": "Plan declared-laws S2 (built): inside the same commit as the write-scope check, every move, round process and knock-on effect is checked against the world's declared laws; a breach refuses the whole step or moment as law_breach and names the law, and nothing changes. A test-run breach is a build finding sent to the rules writer and the world designer. Code: src/world_substrate/laws.py:36."}, {"id": "world-design", "label": "World design (bundle)", "kind": "Substrate", "explain": "The build's first AI step: it reads the description and writes the world's people, places, things and starting state as an authoring bundle; plan declared-laws S1 adds the world's resources and laws to its output, and the rules writer receives them as input. Code: scripts/generate_world_bundle.py:53."}, {"id": "resource", "label": "Declared resource", "kind": "PerWorld", "explain": "Plan declared-laws S1 (Q47, built): something the world keeps track of (cash, pencils), declared once with every field it is kept in on different entities (the customer's cash, the shop's business.cash); laws name resources, never raw fields. Each kept_in place must be a numeric field. Code: scripts/scaffold_world.py:45."}, {"id": "rules-review", "label": "Independent rules review", "kind": "Substrate", "explain": "A separate source-grounded model call reviews proposed rules on both build paths. Mechanical mismatches remain findings, not a blanket pass mark. Declared actor-information worlds also require a complete typed authorization verdict for public setup and every exact initial actor context; missing, unsafe or unavailable review prevents delivery. That gate does not prove reviewer accuracy or scientific fidelity. Code: scripts/review_rules.py:75."}, {"id": "consequence-report", "label": "Consequence report", "kind": "Substrate", "explain": "What the engine works out for an attempt no rule covers, in two passes (ai-judge J1, built 2026-11-10). Pass 1, with no new rule (pass_one): engine.discover for the person acting and for each person the attempt names (their moves, with which checks pass or fail), plus the current values of everyone and everything named; each run records it on every unmatched attempt (consequence.pass_one). The names come from the interpreter's reading (names). Pass 2 (pass_two): a proposed rule goes through the World Builder's rules check, then is test-run on a copy of the world as it is, giving its net changes, blockers, chain length and stopping point; the full chain stays in the report and summary() leaves it out for the judge. Code: scripts/consequence_report.py:67."}, {"id": "judge-ruling", "label": "Judge ruling", "kind": "Substrate", "explain": "Plan ai-judge J2 (built 2026-11-10): Concordia's game master (EventResolution), given the whole world and pass 1 of the consequence report, proposes a rule for the constraint an unmatched attempt raises (can coins change hands here?); after reading the pass 2 test run of that rule it confirms, revises once or withdraws. Never an outcome or another person's choice. Code: scripts/judge.py:288."}, {"id": "ruling-rule", "label": "Ruling-origin rule", "kind": "Substrate", "explain": "Plan ai-judge J3 (built 2026-11-10): a rule in the existing declaration language made from a confirmed judge ruling after it passes the World Builder rules check and test run, listed under its ruling, whose entry records where it came from (round, person, attempt, event id) and its state (installed, held, rejected, withdrawn when installing failed, or language gap); it applies to everyone in the same situation and the attempt settles through it. It is run state, sealed with the snapshot, beside the world's own rules (Rulebook). A ruling the language cannot express is refused and recorded as a language gap. Known defect (Q96): a coin rule written for one person's offer can move coins without the other person's choice. Code: scripts/rulings.py:91."}, {"id": "offer", "label": "Voluntary exchange offer", "kind": "Theory", "explain": "Q96 design contract (planned, not implemented): a server-sealed run-continuation record binding a proposer, respondent, exact terms, rule fingerprint and lifecycle state. The respondent owns acceptance or refusal; acceptance authorizes only those terms and settlement still requires a feasible atomic Engine transition. A message or reusable ruling is not consent. Code: none yet."}, {"id": "credential-holder", "label": "Credential holder", "kind": "Theory", "explain": "Plan ai-judge J4/Q76 (design settled, not implemented): credential value and verifier validity are separate from actor-scoped access, physical token custody and institutional permission. Copying can add access without removing the sender; revocation changes validity without erasing memory. Acquiring, forging or presenting a credential requires its declared mechanism. Code: none yet."}, {"id": "norm", "label": "Norm", "kind": "Theory", "explain": "Plan ai-judge J4 (planned, not implemented): what people expect or forbid (bribery is illegal; only Alice should log in). It can be broken; a breach is recorded and has consequences only when someone notices and acts. Never written as a declared law. Code: none yet."}, {"id": "midrun-setting", "label": "Mid-run rulings setting", "kind": "Substrate", "explain": "Plan ai-judge Decided 5 (J3, built 2026-11-10): a per-world option, 'Judge rulings during a run': Approved by Create (default; a checked ruling is installed at once and the attempt settles through it) or Wait for my approval (the proposed rule is held, the attempt waits as pending, Approve installs the rule and settles it, Reject refuses it; nothing settles without an installed rule). Code: scripts/rulings.py:47."}, {"id": "run-stop", "label": "Run stop setting", "kind": "Substrate", "explain": "A per-world setting saved with the world (run_stop): stop once nothing is changing after N quiet rounds or never for being quiet, plus optional limits, a number of rounds (max_rounds) and this run's recorded AI spending (max_spend_usd); checked after each round, the run stops at whichever fires first and records why (Q12; Brian, 2026-11-10). Code: scripts/run_stop.py:65."}, {"id": "stopping-point", "label": "Plain-words stopping point", "kind": "Theory", "explain": "Plan ai-judge J5 (planned, not implemented): a stopping point the person writes in plain words ('stop once the team has agreed a budget'), assessed by the judge after every completed round; skipping requires proof that the complete dependency set is unchanged, unavailable for unrestricted natural-language conditions, as one more condition of the run stop setting. Code: none yet."}, {"id": "estimate-rule", "label": "Estimate rule", "kind": "Theory", "explain": "Plan estimate-rules E1 (planned, not implemented): a process or move whose outcome depends on a chance (later a pick or an amount) that Jev estimates from fields the rule declares; it declares a fixed question, its reads, the answer type, the model, a required fallback (refuse or a declared value) and the effects for each result. Code: none yet."}, {"id": "estimator", "label": "Estimator", "kind": "Theory", "explain": "Plan estimate-rules E1 (planned, not implemented): what the engine asks for an estimate; live it is llm_client.call_decisions on Jev (one retry, then the rule's fallback), in a replay it reads the recorded estimates and stops with 'no recorded estimate' rather than call Jev; one call per distinct question and inputs per run. Code: none yet."}, {"id": "recorded-estimate", "label": "Recorded estimate", "kind": "Theory", "explain": "Plan estimate-rules E1 (planned, not implemented): on the event, the question, the declared inputs and their values, Jev's answer, the model version returned, the trace id, the cost and whether it was reused from the run's cache; evidence, never world state (Q63). Code: none yet."}, {"id": "recorded-draw", "label": "Recorded draw", "kind": "Theory", "explain": "Plans estimate-rules E1 and open-attempt S3 (planned, not implemented): a number drawn from hash(run seed, event id, rule id) and recorded on the event; an estimate rule's chance becomes an outcome only through it, and a replay reads it. Code: none yet."}, {"id": "actor-input-boundary", "label": "Declared actor-input boundary", "kind": "Substrate", "explain": "The declared-v1 assembly constraining both policy paths to explicit identity/field grants, public setup and actor-owned retained context. It covers profiles, observations, offered forms, feedback and sealed continuation; legacy-unrestricted worlds retain their older inputs. This is not generic Engine read-scope enforcement. Code: scripts/actor_information.py:128."}, {"id": "claim-provenance", "label": "Canonical claim provenance", "kind": "Family", "explain": "Canonical attribution of initialized information: apparent source, declared common originating-claim identity and hidden origin. In declared actor inputs, lineage is private by default and requires lineage_visible_to_actor_ids authorization as well as visible exposure. New actor-authored speech records actual sender/recipient but inherited lineage remains undeclared; repetition is not independent corroboration. Code: spikes/any-scenario-2026-10/compile_spec.py:712."}, {"id": "technical-condition", "label": "Independent technical condition", "kind": "Family", "explain": "The independent procedure's represented passing/failing condition, separate from claims, exposure and validation record. An authorized explicit repair changes it; completed validation reads it. The binary effective repair is a declared bounded intervention, not validated physics. Code: spikes/any-scenario-2026-10/compile_spec.py:621."}, {"id": "expressed-stance", "label": "Actor-owned expressed stance", "kind": "Family", "explain": "A public supportive, concerned, undecided or unexpressed position recorded by that actor's own action. It is distinct from private interpretation and recorded assent; receiving information does not automatically write it. Code: spikes/any-scenario-2026-10/compile_spec.py:665."}, {"id": "recorded-assent", "label": "Separately recorded assent", "kind": "Family", "explain": "The required person's own recorded assent or withdrawal, kept in actor_position.assent and tallied for activation. A supportive statement, delivered report or passing validation cannot supply it. It is also distinct from the outer user's approval to run the rules. Code: spikes/any-scenario-2026-10/compile_spec.py:660."}, {"id": "validation-hold", "label": "Institutional validation hold", "kind": "Family", "explain": "The independent public procedure's activation block from failed validation. Completed authorized passing revalidation clears only this hold; activation still checks recorded assents. Because failure is the stated public cause here, seeing the hold may legitimately reveal failed validation without exposing private test detail. Code: spikes/any-scenario-2026-10/compile_spec.py:685."}], "edges": [{"id": "e0", "source": "engine", "target": "world", "label": "changes"}, {"id": "e1", "source": "engine", "target": "event", "label": "writes"}, {"id": "e2", "source": "move", "target": "engine", "label": "submitted to"}, {"id": "e3", "source": "process", "target": "engine", "label": "run by"}, {"id": "e4", "source": "compiler", "target": "move", "label": "installs"}, {"id": "e5", "source": "compiler", "target": "process", "label": "installs"}, {"id": "e6", "source": "approval", "target": "compiler", "label": "approves output of"}, {"id": "e7", "source": "fingerprint", "target": "approval", "label": "named in"}, {"id": "e8", "source": "policy", "target": "move", "label": "chooses an offered"}, {"id": "e9", "source": "resident", "target": "policy", "label": "is a"}, {"id": "e10", "source": "sense", "target": "move", "label": "gives meaning to"}, {"id": "e11", "source": "compiler", "target": "profile", "label": "freezes"}, {"id": "e12", "source": "approval", "target": "profile", "label": "names"}, {"id": "e13", "source": "profile", "target": "write-scope", "label": "declares"}, {"id": "e14", "source": "engine", "target": "write-scope", "label": "enforces"}, {"id": "e15", "source": "event", "target": "causal-trace", "label": "makes up"}, {"id": "e16", "source": "causal-trace", "target": "readout", "label": "evidence for"}, {"id": "e17", "source": "builder", "target": "build", "label": "runs"}, {"id": "e18", "source": "build", "target": "world-kind", "label": "decides first"}, {"id": "e19", "source": "world-kind", "target": "people-world", "label": "chooses"}, {"id": "e20", "source": "builder", "target": "share", "label": "serves"}, {"id": "e21", "source": "run-log", "target": "scene-replay", "label": "feeds"}, {"id": "e22", "source": "share", "target": "scene-replay", "label": "replays as"}, {"id": "e23", "source": "run-loop", "target": "resident", "l function renderMd(id, item) {

// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  let v;
  // The standalone host already fills the window. Wait for the actual layout
  // before fitting; a timer can run before a large graph has finished laying out.
  const onLayout = D.full ? () => requestAnimationFrame(() => v?.fit()) : sized(el);
  v = GraphViewer.mount(el, {graph: g, onLayout});
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = async () => {
    await mermaid.run({querySelector: '.mermaid:not([data-processed])'});
    document.querySelectorAll('.mermaid svg').forEach(svg => {
      // Mermaid's responsive width shrinks labels with the whole drawing. Keep its
      // native coordinate size instead, and let the existing container scroll.
      const box = svg.viewBox.baseVal;
      if (!box.width || !box.height) return;
      svg.style.width = box.width + 'px';
      svg.style.height = box.height + 'px';
      const el = svg.parentElement;
      el.tabIndex = 0;
      el.setAttribute('role', 'region');
      el.setAttribute('aria-label', 'Diagram. Scroll sideways to read the whole drawing.');
      if (!el.dataset.scrollHelp) {
        const note = document.createElement('p'); note.className = 'note';
        note.textContent = 'Scroll sideways to read wide diagrams. With a keyboard, focus the drawing and use the arrow keys.';
        el.before(note);
        el.dataset.scrollHelp = 'true';
      }
    });
  };
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
